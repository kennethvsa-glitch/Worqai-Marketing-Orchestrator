[project]
name = "worqai-marketing-intelligence"
version = "0.1.0"
description = "Python-first marketing intelligence layer for WorqAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]

[project.scripts]
wmi = "worqai_marketing_intel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worqai_marketing_intel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
