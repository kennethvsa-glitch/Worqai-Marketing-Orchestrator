<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #07080a; padding: 20px; }
    body {
      display: grid;
      grid-template-columns: repeat(3, 360px);
      gap: 20px;
      color: #b8ff00;
      font: 700 15px Consolas, monospace;
    }
    figure { margin: 0; }
    img {
      display: block;
      width: 360px;
      height: 450px;
      object-fit: cover;
      border: 2px solid #2a3038;
      border-radius: 6px;
    }
    figcaption { padding-top: 8px; text-align: center; }
  </style>
</head>
<body>
<figure><img src="slide_01.png"><figcaption>SLIDE 01</figcaption></figure><figure><img src="slide_02.png"><figcaption>SLIDE 02</figcaption></figure><figure><img src="slide_03.png"><figcaption>SLIDE 03</figcaption></figure><figure><img src="slide_04.png"><figcaption>SLIDE 04</figcaption></figure><figure><img src="slide_05.png"><figcaption>SLIDE 05</figcaption></figure><figure><img src="slide_06.png"><figcaption>SLIDE 06</figcaption></figure>
</body>
</html>
