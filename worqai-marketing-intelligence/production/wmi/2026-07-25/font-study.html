<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #222; }
    body { display: flex; flex-direction: column; }
    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #10110f;
      color: #f1ede3;
      padding: 72px;
    }
    .label { font: 700 28px Arial, sans-serif; color: #b8ff00; }
    h1 {
      margin: 170px 0 0;
      max-width: 940px;
      font-size: 152px;
      line-height: .88;
      letter-spacing: -7px;
    }
    p {
      margin: 70px 0 0;
      max-width: 800px;
      font: italic 40px/1.3 Georgia, serif;
    }
    .bahnschrift h1 {
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-variation-settings: "wght" 850, "wdth" 75;
    }
    .arial-narrow h1 {
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 900;
    }
    .impact h1 {
      font-family: Impact, "Arial Black", sans-serif;
      font-weight: 400;
      letter-spacing: -3px;
    }
  </style>
</head>
<body>
  <section class="slide bahnschrift">
    <div class="label">01 — Bahnschrift SemiCondensed</div>
    <h1>Tu CV habla otro idioma.</h1>
    <p>El sistema no adivina. La persona tampoco.</p>
  </section>
  <section class="slide arial-narrow">
    <div class="label">02 — Arial Narrow Bold</div>
    <h1>Tu CV habla otro idioma.</h1>
    <p>El sistema no adivina. La persona tampoco.</p>
  </section>
  <section class="slide impact">
    <div class="label">03 — Impact</div>
    <h1>Tu CV habla otro idioma.</h1>
    <p>El sistema no adivina. La persona tampoco.</p>
  </section>
</body>
</html>
