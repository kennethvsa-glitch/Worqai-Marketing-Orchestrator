<div class="slide{% if is_active %} active{% endif %}">
  {{ geo_html | safe }}

  <div class="tos-wrap">
    {% if copy.kicker %}
    <div class="kicker">{{ copy.kicker }}</div>
    {% endif %}
    <div class="tos-headline {{ text_treatment_class }}">{{ copy.headline }}</div>
    {% if copy.body %}
    <div class="tos-body">{{ copy.body }}</div>
    {% endif %}
  </div>

  <div class="brand">{{ brand }}</div>
  <div class="counter">{{ "%02d" % slide_num }} / {{ "%02d" % total }}</div>
  <div class="prog">
    {% for i in range(total) %}<div class="pd{% if i == slide_num - 1 %} on{% endif %}"></div>{% endfor %}
  </div>
</div>
