<div class="slide{% if is_active %} active{% endif %}">
  {{ geo_html | safe }}

  <div class="fwf-wrap">
    <div class="fwf-frame">
      {% if copy.kicker %}
      <div class="fwf-kicker">{{ copy.kicker }}</div>
      {% endif %}
      <div class="fwf-quote">{{ copy.quote | default(copy.headline) }}</div>
      {% if copy.attribution %}
      <div class="fwf-attr">— {{ copy.attribution }}</div>
      {% endif %}
    </div>
  </div>

  <div class="brand">{{ brand }}</div>
  <div class="counter">{{ "%02d" % slide_num }} / {{ "%02d" % total }}</div>
  <div class="prog">
    {% for i in range(total) %}<div class="pd{% if i == slide_num - 1 %} on{% endif %}"></div>{% endfor %}
  </div>
</div>
