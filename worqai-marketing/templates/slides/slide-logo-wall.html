<div class="slide{% if is_active %} active{% endif %}">
  {{ geo_html | safe }}

  <div class="lw-wrap">
    <div class="lw-headline-text">{{ copy.headline | default('Trusted by') }}</div>
    <div class="lw-grid">
      {% for logo in copy.get('logos', []) %}
      <div class="lw-logo">{{ logo }}</div>
      {% endfor %}
    </div>
  </div>

  <div class="brand">{{ brand }}</div>
  <div class="counter">{{ "%02d" % slide_num }} / {{ "%02d" % total }}</div>
  <div class="prog">
    {% for i in range(total) %}<div class="pd{% if i == slide_num - 1 %} on{% endif %}"></div>{% endfor %}
  </div>
</div>
