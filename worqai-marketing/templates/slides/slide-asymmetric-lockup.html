<div class="slide{% if is_active %} active{% endif %}">
  {{ geo_html | safe }}

  <div class="asym-wrap">
    <div class="asym-content">
      {% if copy.kicker %}
      <div class="asym-kicker">{{ copy.kicker }}</div>
      {% endif %}
      <div class="asym-headline {{ text_treatment_class }}">{{ copy.headline }}</div>
      {% if copy.body %}
      <div class="asym-body">{{ copy.body }}</div>
      {% endif %}
    </div>
  </div>

  <div class="brand">{{ brand }}</div>
  <div class="counter">{{ "%02d" % slide_num }} / {{ "%02d" % total }}</div>
  <div class="prog">
    {% for i in range(total) %}<div class="pd{% if i == slide_num - 1 %} on{% endif %}"></div>{% endfor %}
  </div>
</div>
