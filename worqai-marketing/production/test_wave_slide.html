<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Wave spiral test · cyan purple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #040408;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; gap: 16px;
}
.label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(255,255,255,0.25);
}

.cage { width: 1080px; }
@media (min-width: 1200px) {
  .cage { transform: scale(0.5); transform-origin: top center; height: 540px; }
}

/* ── SLIDE ─────────────────────────────────────────────────── */
.slide {
  position: relative;
  width: 1080px; height: 1080px;
  overflow: hidden; border-radius: 24px;
  background: linear-gradient(160deg, #06040F 0%, #04060E 50%, #080412 100%);
  box-shadow: 0 40px 100px rgba(0,0,20,0.9), 0 0 0 1px rgba(0,200,255,0.07);
}

/* GRAIN */
.slide::before {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 300px 300px; mix-blend-mode: overlay; opacity: 0.09;
  pointer-events: none;
}

/* ATMOSPHERIC */
.slide::after {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 10% 50%, rgba(0,200,255,0.10), transparent 65%),
    radial-gradient(ellipse 50% 45% at 90% 50%, rgba(120,40,255,0.12), transparent 60%);
}

/* ── WAVE SVG LAYER ─────────────────────────────────────────── */
.wave-layer {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 2;
  overflow: hidden;
}

/* SUPPLEMENTARY GLOWS — follow the wave path */
.glow-left {
  position: absolute; width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,200,255,0.22) 0%, transparent 65%);
  filter: blur(80px); pointer-events: none; z-index: 3;
  top: 28%; left: -8%;
}
.glow-center {
  position: absolute; width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(120,40,255,0.24) 0%, transparent 65%);
  filter: blur(70px); pointer-events: none; z-index: 3;
  top: 38%; left: 36%;
}
.glow-right {
  position: absolute; width: 460px; height: 460px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,200,255,0.16) 0%, transparent 65%);
  filter: blur(80px); pointer-events: none; z-index: 3;
  top: 22%; right: -10%;
}

/* GHOST */
.ghost {
  position: absolute; z-index: 2;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700;
  font-size: 520px; line-height: 0.85; letter-spacing: -0.05em;
  color: rgba(0,200,255,0.03); pointer-events: none; user-select: none;
  top: -6%; left: -4%;
}

/* CONTENT */
.content {
  position: relative; z-index: 5;
  height: 100%; padding: 96px 88px 140px;
  display: flex; flex-direction: column;
}
.lbl {
  font-size: 18px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: #00CFFF; margin-bottom: 28px;
}
.disp {
  font-weight: 700; font-size: 118px;
  line-height: 0.96; letter-spacing: -0.04em; color: #F0F4FF;
  margin-top: auto; margin-bottom: 32px;
}
.disp .hi { color: #00CFFF; }
.disp .hi2 { color: #9B6FFF; }
.body {
  font-weight: 300; font-size: 30px; line-height: 1.5;
  color: rgba(240,244,255,0.65); max-width: 640px;
}
.swipe {
  display: inline-flex; align-items: center; padding: 14px 26px;
  border: 2px solid #00CFFF; color: #00CFFF; border-radius: 999px;
  font-size: 18px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; margin-top: 36px; margin-bottom: auto;
  background: rgba(0,207,255,0.07);
}
.brand {
  position: absolute; bottom: 46px; left: 88px; z-index: 5;
  font-weight: 700; font-size: 30px; letter-spacing: -1.2px;
  text-transform: lowercase; color: #F0F4FF;
}
.brand .ai { color: #00CFFF; }
.counter {
  position: absolute; bottom: 50px; right: 88px; z-index: 5;
  font-weight: 500; font-size: 18px; letter-spacing: 0.2em;
  color: rgba(240,244,255,0.32);
}
</style>
</head>
<body>

<div class="label">WAVE SPIRAL · cyan + purple · left-to-right</div>
<div class="cage">
  <div class="slide">

    <!-- ── WAVE SVG ─────────────────────────────────────────── -->
    <div class="wave-layer">
      <svg width="1080" height="1080" viewBox="0 0 1080 1080"
           xmlns="http://www.w3.org/2000/svg"
           style="position:absolute;inset:0;overflow:visible;">
        <defs>
          <!-- Gradient along the wave: cyan → purple → cyan -->
          <linearGradient id="wg1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#00CFFF" stop-opacity="0"/>
            <stop offset="15%"  stop-color="#00CFFF" stop-opacity="0.9"/>
            <stop offset="50%"  stop-color="#9B6FFF" stop-opacity="1"/>
            <stop offset="85%"  stop-color="#00CFFF" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#00CFFF" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="wg2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#9B6FFF" stop-opacity="0"/>
            <stop offset="20%"  stop-color="#9B6FFF" stop-opacity="0.7"/>
            <stop offset="55%"  stop-color="#00CFFF" stop-opacity="0.8"/>
            <stop offset="88%"  stop-color="#9B6FFF" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#9B6FFF" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="wg3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#00CFFF" stop-opacity="0"/>
            <stop offset="30%"  stop-color="#00CFFF" stop-opacity="0.35"/>
            <stop offset="60%"  stop-color="#9B6FFF" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#9B6FFF" stop-opacity="0"/>
          </linearGradient>
          <!-- Glow filter -->
          <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-soft" x="-30%" y="-100%" width="160%" height="300%">
            <feGaussianBlur stdDeviation="18"/>
          </filter>
        </defs>

        <!-- BACKGROUND GLOW ECHO — fat blurred version of primary wave -->
        <path d="M -20,680
                 C 160,320 320,820 540,520
                 C 760,220 920,700 1100,400"
              stroke="#00CFFF" stroke-width="80" fill="none"
              stroke-linecap="round"
              opacity="0.08" filter="url(#glow-soft)"/>

        <path d="M -20,680
                 C 160,320 320,820 540,520
                 C 760,220 920,700 1100,400"
              stroke="#9B6FFF" stroke-width="60" fill="none"
              stroke-linecap="round"
              opacity="0.06" filter="url(#glow-soft)"/>

        <!-- SECONDARY WAVE — offset above, thinner, purple-leading -->
        <path d="M -20,560
                 C 180,230 340,710 540,440
                 C 740,170 900,620 1100,320"
              stroke="url(#wg2)" stroke-width="2.5" fill="none"
              stroke-linecap="round" opacity="0.7"/>

        <!-- TERTIARY WAVE — below, even thinner, subtle -->
        <path d="M -20,780
                 C 150,460 360,900 540,620
                 C 720,340 940,760 1100,500"
              stroke="url(#wg3)" stroke-width="1.5" fill="none"
              stroke-linecap="round" opacity="0.55"/>

        <!-- MICRO WAVE — very thin, tracks the spiral tightly -->
        <path d="M -20,620
                 C 170,280 330,760 540,480
                 C 750,200 910,660 1100,360"
              stroke="#00CFFF" stroke-width="1" fill="none"
              stroke-linecap="round" opacity="0.40"/>

        <!-- PRIMARY WAVE — main ribbon, glowing -->
        <path d="M -20,680
                 C 160,320 320,820 540,520
                 C 760,220 920,700 1100,400"
              stroke="url(#wg1)" stroke-width="4" fill="none"
              stroke-linecap="round"
              filter="url(#glow)" opacity="0.95"/>

        <!-- NODE DOTS — punctuation at wave inflection points -->
        <circle cx="540" cy="520" r="5" fill="#9B6FFF" opacity="0.9" filter="url(#glow)"/>
        <circle cx="270" cy="590" r="3" fill="#00CFFF" opacity="0.7"/>
        <circle cx="810" cy="450" r="3" fill="#00CFFF" opacity="0.7"/>
        <circle cx="100" cy="650" r="2" fill="#9B6FFF" opacity="0.5"/>
        <circle cx="980" cy="430" r="2" fill="#9B6FFF" opacity="0.5"/>
      </svg>
    </div>

    <!-- atmospheric glows -->
    <div class="glow-left"></div>
    <div class="glow-center"></div>
    <div class="glow-right"></div>

    <!-- ghost -->
    <div class="ghost">W</div>

    <!-- content -->
    <div class="content">
      <div class="lbl">worqai / ATS</div>
      <div class="disp">Tu CV nunca<br>llegó a ningún<br><span class="hi">humano.</span></div>
      <div class="body">El software que lo eliminó tardó 0.3 segundos.</div>
      <div class="swipe">Desliza →</div>
    </div>

    <div class="brand"><span>worq</span><span class="ai">ai</span></div>
    <div class="counter">01 / 08</div>

  </div>
</div>

</body>
</html>
