<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watercolor — Light Background</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{display:flex;align-items:center;justify-content:center;background:#FAFAFA;}
.canvas{
  position:relative;
  width:1080px;height:1080px;
  background:#FAFAFA;
  overflow:hidden;
}
.deco{
  position:absolute;
  pointer-events:none;
  z-index:1;
}
</style>
</head>
<body>
<div class="canvas">

  <!-- 1. Top-left lime blob -->
  <svg class="deco" style="top:-140px;left:-180px;width:600px;height:560px;" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wc-tl" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#C7FF3A;stop-opacity:0.55"/>
        <stop offset="50%" style="stop-color:#C7FF3A;stop-opacity:0.20"/>
        <stop offset="100%" style="stop-color:#C7FF3A;stop-opacity:0"/>
      </linearGradient>
    </defs>
    <path d="M-20,-20 C120,0 260,80 340,200 C420,320 360,460 240,520 C120,580 0,500 -40,360 C-80,240 -60,120 -20,-20Z" fill="url(#wc-tl)" filter="blur(24px)"/>
  </svg>

  <!-- 2. Bottom-right lime blob -->
  <svg class="deco" style="bottom:-160px;right:-200px;width:640px;height:600px;" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wc-br" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" style="stop-color:#C7FF3A;stop-opacity:0.50"/>
        <stop offset="50%" style="stop-color:#C7FF3A;stop-opacity:0.18"/>
        <stop offset="100%" style="stop-color:#C7FF3A;stop-opacity:0"/>
      </linearGradient>
    </defs>
    <path d="M660,620 C520,600 380,520 300,400 C220,280 280,160 400,100 C520,40 640,120 680,260 C720,380 700,500 660,620Z" fill="url(#wc-br)" filter="blur(26px)"/>
  </svg>

  <!-- 3. Thin wavy line at top -->
  <svg class="deco" style="top:40px;left:120px;width:500px;height:80px;" viewBox="0 0 500 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C60,10 120,70 180,30 C240,-10 300,60 360,20 C420,-20 480,50 500,30" fill="none" stroke="rgba(199,255,58,0.28)" stroke-width="2" stroke-linecap="round"/>
  </svg>

  <!-- 4. Three scribble/dash marks near top-left -->
  <svg class="deco" style="top:100px;left:80px;width:80px;height:60px;" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M10,15 L30,12" fill="none" stroke="rgba(199,255,58,0.35)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8,30 L35,28" fill="none" stroke="rgba(199,255,58,0.28)" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,48 L28,45" fill="none" stroke="rgba(199,255,58,0.32)" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <!-- 5. Column of 3 dots (descending size) on left side -->
  <svg class="deco" style="top:320px;left:60px;width:40px;height:120px;" viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="8" fill="rgba(199,255,58,0.30)"/>
    <circle cx="20" cy="55" r="5" fill="rgba(199,255,58,0.22)"/>
    <circle cx="20" cy="90" r="3" fill="rgba(199,255,58,0.16)"/>
  </svg>

  <!-- 6. Small 4-pointed star/sparkle near top-right -->
  <svg class="deco" style="top:80px;right:140px;width:40px;height:40px;" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <path d="M20,0 L23,17 L40,20 L23,23 L20,40 L17,23 L0,20 L17,17Z" fill="rgba(199,255,58,0.38)"/>
  </svg>

  <!-- 7. Small swirl/loop near top -->
  <svg class="deco" style="top:60px;left:420px;width:60px;height:60px;" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M45,20 C50,30 48,45 35,48 C22,52 12,42 14,28 C16,14 30,10 38,18" fill="none" stroke="rgba(199,255,58,0.28)" stroke-width="2" stroke-linecap="round"/>
  </svg>

  <!-- 8. Small dot grid (4×4) near top-right -->
  <svg class="deco" style="top:140px;right:80px;width:64px;height:64px;" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <circle cx="8" cy="8" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="24" cy="8" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="40" cy="8" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="56" cy="8" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="8" cy="24" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="24" cy="24" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="40" cy="24" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="56" cy="24" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="8" cy="40" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="24" cy="40" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="40" cy="40" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="56" cy="40" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="8" cy="56" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="24" cy="56" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="40" cy="56" r="3" fill="rgba(199,255,58,0.22)"/>
    <circle cx="56" cy="56" r="3" fill="rgba(199,255,58,0.22)"/>
  </svg>

  <!-- 9. Diagonal lines in circular area near bottom-left -->
  <svg class="deco" style="bottom:180px;left:80px;width:120px;height:120px;" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(199,255,58,0.12)" stroke-width="1"/>
    <line x1="20" y1="80" x2="50" y2="50" stroke="rgba(199,255,58,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="95" x2="65" y2="65" stroke="rgba(199,255,58,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="105" x2="80" y2="75" stroke="rgba(199,255,58,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="110" x2="95" y2="80" stroke="rgba(199,255,58,0.20)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="45" y2="45" stroke="rgba(199,255,58,0.20)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="75" y1="100" x2="100" y2="75" stroke="rgba(199,255,58,0.18)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <!-- 10. Small sparkle/asterisk near mid-right -->
  <svg class="deco" style="top:480px;right:120px;width:36px;height:36px;" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
    <path d="M18,0 L20,16 L36,18 L20,20 L18,36 L16,20 L0,18 L16,16Z" fill="rgba(199,255,58,0.32)"/>
  </svg>

</div>
</body>
</html>
