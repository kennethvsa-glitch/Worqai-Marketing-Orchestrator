<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watercolor Dark Background</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0A0A0A;}
.canvas{position:relative;width:1080px;height:1080px;overflow:hidden;background:#0A0A0A;}
.canvas::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:300px 300px;opacity:0.05;pointer-events:none;z-index:10;}
</style>
</head>
<body>
<div class="canvas">
  <svg style="position:absolute;inset:0;z-index:1;" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="wb1" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="rgba(199,255,58,0.15)"/><stop offset="70%" stop-color="rgba(199,255,58,0.03)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <radialGradient id="wb2" cx="80%" cy="80%" r="55%"><stop offset="0%" stop-color="rgba(199,255,58,0.12)"/><stop offset="70%" stop-color="rgba(199,255,58,0.02)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <radialGradient id="wb3" cx="20%" cy="85%" r="50%"><stop offset="0%" stop-color="rgba(100,100,110,0.20)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <radialGradient id="wb4" cx="75%" cy="15%" r="45%"><stop offset="0%" stop-color="rgba(80,80,90,0.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <radialGradient id="wbg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(199,255,58,0.08)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    </defs>
    <!-- Dark organic blobs -->
    <path d="M -40 0 C 120 40 280 180 180 320 C 80 460 -60 380 -40 0 Z" fill="url(#wb1)" opacity="0.85"/>
    <path d="M 880 680 C 1020 780 1140 920 1040 1080 C 940 1140 800 1020 880 680 Z" fill="url(#wb2)" opacity="0.85"/>
    <path d="M 0 720 C 140 680 300 820 220 950 C 140 1080 -40 1020 0 720 Z" fill="url(#wb3)" opacity="0.8"/>
    <path d="M 820 0 C 980 60 1080 200 960 280 C 840 360 720 180 820 0 Z" fill="url(#wb4)" opacity="0.75"/>
    <!-- Overlay organic shapes (lighter on dark) -->
    <path d="M 80 60 Q 200 120 160 220 Q 120 320 40 280 Q -20 240 80 60 Z" fill="rgba(30,30,32,0.8)" opacity="0.9"/>
    <path d="M 950 750 Q 1050 820 1000 920 Q 950 1020 880 960 Q 820 900 950 750 Z" fill="rgba(28,28,30,0.8)" opacity="0.9"/>
    <path d="M 600 100 Q 720 160 660 280 Q 600 400 500 340 Q 420 280 600 100 Z" fill="rgba(25,25,28,0.7)" opacity="0.8"/>
    <!-- Small dots -->
    <g fill="rgba(255,255,255,0.25)" opacity="0.6">
      <circle cx="220" cy="180" r="2.5"/><circle cx="260" cy="220" r="1.5"/><circle cx="180" cy="260" r="2"/><circle cx="240" cy="280" r="1.2"/><circle cx="200" cy="140" r="1.5"/>
      <circle cx="280" cy="160" r="1"/><circle cx="160" cy="200" r="2"/><circle cx="300" cy="240" r="1.5"/>
    </g>
    <g fill="rgba(199,255,58,0.35)" opacity="0.5">
      <circle cx="850" cy="780" r="2"/><circle cx="900" cy="820" r="1.5"/><circle cx="820" cy="860" r="2.5"/><circle cx="880" cy="800" r="1.2"/><circle cx="840" cy="840" r="1.5"/>
    </g>
    <!-- Thin curved lines -->
    <path d="M 200 200 Q 400 280 600 200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" opacity="0.6"/>
    <path d="M 800 800 Q 600 880 400 800" fill="none" stroke="rgba(199,255,58,0.10)" stroke-width="1.5" opacity="0.5"/>
    <path d="M 500 500 Q 650 450 750 550" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" opacity="0.4"/>
    <!-- Center glow -->
    <circle cx="540" cy="540" r="350" fill="url(#wbg)" opacity="0.4"/>
  </svg>
</div>
</body>
</html>
