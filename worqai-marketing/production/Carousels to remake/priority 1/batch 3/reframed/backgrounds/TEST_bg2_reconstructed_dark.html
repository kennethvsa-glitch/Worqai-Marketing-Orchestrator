<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorqAI Background — Dark</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0A0A;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.frame{position:relative;width:1080px;height:1080px;background:#0A0A0A;overflow:hidden;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.bg-deco{position:absolute;pointer-events:none;z-index:1;}
.glow-tl{top:-180px;left:-180px;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,rgba(199,255,58,0.08),transparent 65%);}
.glow-br{bottom:-180px;right:-180px;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,rgba(199,255,58,0.08),transparent 65%);}
.dot-grid-tl{top:190px;left:130px;width:60px;height:60px;background-image:radial-gradient(circle,#C7FF3A 1.5px,transparent 1.5px);background-size:14px 14px;opacity:0.65;}
.dot-grid-mr{top:440px;right:100px;width:100px;height:130px;background-image:radial-gradient(circle,#C7FF3A 1.5px,transparent 1.5px);background-size:16px 16px;opacity:0.18;}
</style>
</head>
<body>
<div class="frame">
  <div class="bg-deco glow-tl"></div>
  <div class="bg-deco glow-br"></div>
  <div class="bg-deco dot-grid-tl"></div>
  <div class="bg-deco dot-grid-mr"></div>

  <svg class="bg-deco" width="1080" height="1080" viewBox="0 0 1080 1080" style="position:absolute;top:0;left:0;width:100%;height:100%;">
    <!-- Top-left organic blob -->
    <path d="M 0,0 L 420,0 C 400,70 320,110 240,110 C 160,110 80,170 65,270 L 0,270 Z" fill="#C7FF3A"/>
    <!-- Top-left curved border -->
    <path d="M 0,290 L 65,290 C 80,190 160,130 240,130 C 320,130 400,90 420,20" fill="none" stroke="#C7FF3A" stroke-width="2" opacity="0.9"/>

    <!-- Bottom-right organic blob -->
    <path d="M 1080,1080 L 660,1080 C 680,970 760,930 840,930 C 920,930 1000,870 1015,770 L 1080,770 Z" fill="#C7FF3A"/>
    <!-- Bottom-right curved border -->
    <path d="M 1080,750 L 1015,750 C 1000,850 920,910 840,910 C 760,910 680,950 660,1050" fill="none" stroke="#C7FF3A" stroke-width="2" opacity="0.9"/>

    <!-- Bottom-left partial circle -->
    <circle cx="0" cy="1080" r="75" fill="#C7FF3A"/>
    <!-- Bottom-left circle border -->
    <path d="M 15,1010 A 78,78 0 0 1 90,1065" fill="none" stroke="#C7FF3A" stroke-width="2" opacity="0.8"/>

    <!-- Top-right curved arc -->
    <path d="M 960,0 A 120,120 0 0 1 1080,120" fill="none" stroke="#C7FF3A" stroke-width="2" opacity="0.6"/>

    <!-- Star 1 (bottom-left area) -->
    <rect x="0" y="7" width="16" height="2" fill="#C7FF3A" rx="1" transform="translate(200,880) rotate(15)"/>
    <rect x="7" y="0" width="2" height="16" fill="#C7FF3A" rx="1" transform="translate(200,880) rotate(15)"/>
    <!-- Star 2 (top-right area) -->
    <rect x="0" y="7" width="16" height="2" fill="#C7FF3A" opacity="0.5" rx="1" transform="translate(920,320) rotate(30)"/>
    <rect x="7" y="0" width="2" height="16" fill="#C7FF3A" opacity="0.5" rx="1" transform="translate(920,320) rotate(30)"/>

    <!-- Filled chevrons (left-mid) -->
    <path d="M 0,4 L 14,14 L 0,24" fill="none" stroke="#C7FF3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(50,490)"/>
    <path d="M 12,4 L 26,14 L 12,24" fill="none" stroke="#C7FF3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(50,490)"/>
    <path d="M 24,4 L 38,14 L 24,24" fill="none" stroke="#C7FF3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(50,490)"/>

    <!-- Outline chevrons (right-mid) -->
    <path d="M 0,4 L 14,14 L 0,24" fill="none" stroke="#C7FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(920,390)"/>
    <path d="M 12,4 L 26,14 L 12,24" fill="none" stroke="#C7FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(920,390)"/>
    <path d="M 24,4 L 38,14 L 24,24" fill="none" stroke="#C7FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(920,390)"/>

    <!-- Diagonal slashes (bottom-center) -->
    <path d="M 460,990 L 472,970 M 484,990 L 496,970 M 508,990 L 520,970 M 532,990 L 544,970 M 556,990 L 568,970 M 580,990 L 592,970 M 604,990 L 616,970" stroke="#C7FF3A" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>
