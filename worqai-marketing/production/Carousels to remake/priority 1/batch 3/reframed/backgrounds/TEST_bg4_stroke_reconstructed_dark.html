<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stroke Dark Reconstructed</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0A0A0A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.canvas{position:relative;width:1080px;height:1080px;overflow:hidden;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div class="canvas">

  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/>
  <circle cx="180" cy="150" r="320" fill="#8AB82E" opacity="0.22"/>

  <path d="M120 80 Q200 200 180 350" stroke="#E5E5E5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M750 850 Q900 750 1080 850 L1080 1080 L700 1080 Z" fill="#222222"/>

  <circle cx="180" cy="920" r="280" fill="#1a1a1a" opacity="0.8"/>

  <path d="M-20 770 A180 180 0 0 1 360 770" stroke="#8AB82E" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M-20 790 A160 160 0 0 1 340 790" stroke="#8AB82E" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M-20 810 A140 140 0 0 1 320 810" stroke="#8AB82E" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M-20 830 A120 120 0 0 1 300 830" stroke="#8AB82E" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M-20 850 A100 100 0 0 1 280 850" stroke="#8AB82E" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="60" cy="980" r="3" fill="#C7FF3A" opacity="0.5"/>

  <circle cx="140" cy="980" r="3" fill="#C7FF3A" opacity="0.5"/>
  <circle cx="160" cy="960" r="3" fill="#C7FF3A" opacity="0.5"/>
  <rect x="850" y="50" width="160" height="160" fill="url(#stdot)"/>
  <path d="M450 700 Q550 600 650 750" stroke="#444444" stroke-width="80" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M900 400 Q950 500 920 650" stroke="#E5E5E5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.2"/>
</svg>
</div>
</body>
</html>
