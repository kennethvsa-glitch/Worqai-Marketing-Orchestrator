<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — 17 WORQAI VERDE · Dark Bold</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }

  .preview-cage { width: 1080px; margin: 0 auto; }
  @media (min-width: 1200px) {
    .preview-cage { transform: scale(0.5); transform-origin: top center; height: 540px; }
  }

  .slide {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(148deg, #1A1A18 0%, #0F0F12 100%);
    position: relative;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 96px 80px 140px;
  }

  /* Grain */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.05;
    pointer-events: none;
    z-index: 4;
  }

  /* Lime glow — top-right */
  .glow {
    position: absolute;
    top: -15%;
    right: -10%;
    width: 55%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(199,255,58,0.18) 0%, transparent 65%);
    filter: blur(70px);
    pointer-events: none;
    z-index: 1;
  }

  /* Secondary coral glow — bottom-left */
  .glow-2 {
    position: absolute;
    bottom: -10%;
    left: -5%;
    width: 35%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,92,60,0.10) 0%, transparent 65%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 1;
  }

  /* Giant W watermark */
  .brand-w {
    position: absolute;
    top: -8%;
    left: -6%;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 620px;
    letter-spacing: -0.06em;
    line-height: 0.8;
    color: rgba(199,255,58,0.045);
    pointer-events: none;
    user-select: none;
    z-index: 1;
  }

  /* Diagonal lime band */
  .band {
    position: absolute;
    top: -10%;
    left: -10%;
    width: 130%;
    height: 30%;
    background: linear-gradient(115deg, transparent 45%, rgba(199,255,58,0.04) 45%, rgba(199,255,58,0.04) 47%, transparent 47%);
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 3;
  }

  .label {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,248,231,0.40);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .label::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 2px;
    background: #C7FF3A;
    flex-shrink: 0;
  }

  .headline {
    font-weight: 900;
    font-size: 88px;
    line-height: 0.97;
    letter-spacing: -0.03em;
    color: #FFF8E7;
    margin-bottom: 44px;
  }

  .headline .lime { color: #C7FF3A; }

  /* Coral dot punctuation */
  .coral-dot {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #FF5C3C;
    vertical-align: middle;
    margin-left: 6px;
    margin-bottom: 6px;
  }

  .body-text {
    font-weight: 400;
    font-size: 20px;
    line-height: 1.55;
    color: rgba(255,248,231,0.50);
    max-width: 540px;
  }

  /* Brand wordmark */
  .brand {
    position: absolute;
    bottom: 46px;
    left: 80px;
    z-index: 10;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -1.5px;
    text-transform: lowercase;
  }
  .brand .w { color: #FFF8E7; }
  .brand .ai { color: #C7FF3A; }

  .counter {
    position: absolute;
    bottom: 50px;
    right: 80px;
    z-index: 10;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: rgba(255,248,231,0.35);
  }
</style>
</head>
<body>
<div class="preview-cage">
  <div class="slide">
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="brand-w">W</div>
    <div class="band"></div>

    <div class="content">
      <div class="label">WorqAI · La verdad sobre tu CV</div>
      <h1 class="headline">
        Tu CV nunca<br>llega a <span class="lime">recursos</span><br>humanos<span class="coral-dot"></span>
      </h1>
      <p class="body-text">
        El 75% de los CVs son eliminados por un algoritmo antes de que un humano los vea. Aquí está lo que nadie te dice.
      </p>
    </div>

    <div class="brand"><span class="w">worq</span><span class="ai">ai</span></div>
    <div class="counter">01 / 07</div>
  </div>
</div>
</body>
</html>
