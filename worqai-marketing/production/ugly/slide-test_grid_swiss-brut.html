<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — 25 SWISS BRUT ACCENT · Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }

  .preview-cage { width: 1080px; margin: 0 auto; }
  @media (min-width: 1200px) {
    .preview-cage { transform: scale(0.5); transform-origin: top center; height: 540px; }
  }

  /* Light BG chrome overrides */
  :root {
    --text-secondary: rgba(10,15,30,0.35);
    --accent: #ff0015;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(180deg, #ffffff, #f2f2f2);
    position: relative;
    overflow: hidden;
    font-family: 'Archivo', sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Heavy red top bar */
  .top-bar {
    width: 100%;
    height: 14px;
    background: #ff0015;
    flex-shrink: 0;
    z-index: 5;
    position: relative;
  }

  /* Bottom red bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: #ff0015;
    z-index: 5;
  }

  /* Subtle grain */
  .grain {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    opacity: 0.08;
    pointer-events: none;
    z-index: 2;
  }

  /* Halftone dots - bottom right */
  .halftone {
    position: absolute;
    bottom: 80px;
    right: 60px;
    width: 260px;
    height: 260px;
    background-image: radial-gradient(circle, rgba(255,0,21,0.28) 2.5px, transparent 2.5px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
  }

  /* Black radial at bottom-left per spec */
  .corner-grad {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle at 0% 100%, rgba(0,0,0,0.06), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 3;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 56px 80px 96px;
  }

  /* Big deco number — top right (exception: 25 keeps deco-num visible) */
  .deco-num {
    position: absolute;
    top: 40px;
    right: 64px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 220px;
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: #ff0015;
    opacity: 0.85;
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }

  .label {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #444444;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .label::before {
    content: '';
    display: inline-block;
    width: 24px;
    height: 3px;
    background: #ff0015;
    flex-shrink: 0;
  }

  /* Full-width thick horizontal rule */
  .rule-heavy {
    width: 100%;
    height: 5px;
    background: #000000;
    margin-bottom: 40px;
  }

  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 74px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: #000000;
    max-width: 680px;
    margin-bottom: 44px;
    position: relative;
    z-index: 3;
  }

  .headline .red { color: #ff0015; }

  /* Light rule under headline */
  .rule-light {
    width: 100%;
    height: 2px;
    background: #000000;
    opacity: 0.10;
    margin-bottom: 32px;
  }

  .body-text {
    font-family: 'Archivo', sans-serif;
    font-weight: 400;
    font-size: 19px;
    line-height: 1.55;
    color: #444444;
    max-width: 560px;
  }

  /* Brand wordmark */
  .brand {
    position: absolute;
    bottom: 28px;
    left: 80px;
    z-index: 10;
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: -0.5px;
    text-transform: lowercase;
    color: rgba(0,0,0,0.20);
  }
  .brand .ai { color: #ff0015; opacity: 1; }

  .counter {
    position: absolute;
    bottom: 32px;
    right: 80px;
    z-index: 10;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: rgba(0,0,0,0.30);
  }
</style>
</head>
<body>
<div class="preview-cage">
  <div class="slide">
    <div class="top-bar"></div>
    <div class="bottom-bar"></div>
    <div class="grain"></div>
    <div class="halftone"></div>
    <div class="corner-grad"></div>
    <div class="deco-num">5</div>

    <div class="content">
      <div class="label">WorqAI · Los errores más comunes</div>
      <div class="rule-heavy"></div>
      <h1 class="headline">
        Errores que matan<br>tu candidatura<br>antes de <span class="red">empezar.</span>
      </h1>
      <div class="rule-light"></div>
      <p class="body-text">No es tu experiencia. No es tu carrera. Es el formato de tu CV. Aquí están los 5 más comunes y cómo corregirlos.</p>
    </div>

    <div class="brand">worq<span class="ai">ai</span></div>
    <div class="counter">01 / 06</div>
  </div>
</div>
</body>
</html>
