<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Tests 01–08 · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0e0e;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px 56px;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

.viewer { display: flex; flex-direction: column; align-items: center; gap: 16px; }

.viewer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 540px;
}

.v-label {
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  font-weight: 300;
}

.viewport {
  width: 540px;
  height: 675px;
  overflow: hidden;
  position: relative;
}

.track {
  display: flex;
  height: 675px;
  transition: transform 0.5s cubic-bezier(0.22, 0.68, 0, 1.2);
}

/* 1080×1350 → scaled 50% → 540×675 */
.slide-wrapper {
  flex-shrink: 0;
  width: 540px;
  height: 675px;
  overflow: hidden;
}

.slide {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  transform: scale(0.5);
  transform-origin: top left;
}

.nav {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 540px;
  justify-content: space-between;
}

.nav-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.35);
  width: 34px;
  height: 34px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
  font-family: inherit;
}

.nav-btn:hover {
  border-color: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.7);
}

.slide-name {
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  font-weight: 300;
  flex: 1;
}

.dots-row { display: flex; gap: 6px; }

.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  cursor: pointer;
  transition: all 0.2s;
}

.dot.active {
  background: rgba(255,255,255,0.5);
  width: 18px;
  border-radius: 2px;
}

/* ──────────────────────────────────────────────
   SHARED SLIDE TOKENS — whisper-light system
   ────────────────────────────────────────────── */

/* All structural lines: stroke 0.6–0.8px, opacity 0.04–0.10 */
/* All fill areas: opacity 0.03–0.07 */
/* Typography: 7px, tracking 0.30–0.36em, weight 300–400, opacity 0.18–0.26 */

.slide-label {
  position: absolute;
  font-size: 7px;
  letter-spacing: 0.34em;
  font-weight: 300;
  text-transform: uppercase;
  color: rgba(0,0,0,0.22);
  pointer-events: none;
  font-family: 'Inter', sans-serif;
}


/* ══════════════════════════════════════════════
   SLIDE 01 — LUXURY FRAME GRID
   Spatial logic: primary frame sits top-left
   biased. Dot cluster far top-right creates
   tension. Staggered lines anchor lower-left.
   Everything whisper-light except copper anchor.
   ══════════════════════════════════════════════ */

.slide-01 { background: #f4f2ef; }

/* Primary frame — optical top-left bias */
.s01-frame {
  position: absolute;
  top: 92px;
  left: 84px;
  right: 144px;
  bottom: 160px;
  border: 1px solid rgba(168,108,56,0.13);
}

/* Copper L-bracket — the one heavy anchor */
.s01-bracket {
  position: absolute;
  top: 92px;
  left: 84px;
}

.s01-bracket::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 44px;
  height: 1.5px;
  background: rgba(168,108,56,0.6);
}

.s01-bracket::after {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 1.5px;
  height: 44px;
  background: rgba(168,108,56,0.6);
}

/* Micro accent block — sole solid anchor */
.s01-accent {
  position: absolute;
  top: 152px;
  right: 224px;
  width: 10px;
  height: 10px;
  background: rgba(168,108,56,0.62);
}

/* Left float line — tension element */
.s01-float-line {
  position: absolute;
  left: 56px;
  top: 380px;
  width: 1px;
  height: 96px;
  background: rgba(0,0,0,0.07);
}

/* Left edge tick marks */
.s01-ticks-l {
  position: absolute;
  left: 46px;
  top: 382px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.s01-tick { height: 1px; background: rgba(0,0,0,0.10); }

/* 3×3 dot matrix — upper-right tension point */
.s01-dots {
  position: absolute;
  top: 186px;
  right: 164px;
  display: grid;
  grid-template-columns: repeat(3, 11px);
  gap: 8px;
}

.s01-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #111;
  opacity: 0.09;
  justify-self: center;
  align-self: center;
}

/* Staggered lines — lower-left quiet zone */
.s01-lines {
  position: absolute;
  bottom: 168px;
  left: 108px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.s01-hline { height: 1px; background: rgba(0,0,0,0.16); }

/* Small empty circle — mid-right drift */
.s01-circle {
  position: absolute;
  right: 204px;
  bottom: 308px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.13);
}

/* Right edge ticks */
.s01-ticks-r {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.s01-rtick { height: 1px; background: rgba(0,0,0,0.07); }


/* ══════════════════════════════════════════════
   SLIDE 02 — SOFT GLASSMORPHIC PANELS
   Spatial logic: no blur, no shadow. Three
   asymmetric panels at near-zero opacity.
   Panels read via hairline border only.
   Positioned with optical drift, not grid.
   ══════════════════════════════════════════════ */

.slide-02 { background: #ebe9f2; }

.s02-panel {
  position: absolute;
  background: rgba(255,255,255,0.055);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 28px;
  /* NO backdrop-filter. NO box-shadow. */
}

/* Large dominant — top-right, drifts slightly into frame */
.s02-a {
  top: 72px;
  right: 64px;
  width: 468px;
  height: 356px;
}

/* Medium — left, lower, offset from panel A */
.s02-b {
  top: 298px;
  left: 60px;
  width: 348px;
  height: 420px;
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.12);
}

/* Small — bottom right, partially under panel A edge */
.s02-c {
  bottom: 96px;
  right: 72px;
  width: 212px;
  height: 152px;
  background: rgba(255,255,255,0.072);
  border-color: rgba(255,255,255,0.18);
  border-radius: 20px;
}


/* ══════════════════════════════════════════════
   SLIDE 03 — ARCHITECTURAL EDITORIAL LINES
   Spatial logic: primary rect pushed toward
   right edge (creates tension). Enormous
   SVG circle comes in from bottom-right.
   Black anchor bar = sole heavy element.
   Everything else: ghost lines.
   ══════════════════════════════════════════════ */

.slide-03 { background: #f7f7f5; }

/* Primary rect — right-biased, nearly cropping edge */
.s03-rect {
  position: absolute;
  top: 152px;
  left: 196px;
  width: 812px;
  height: 866px;
  border: 1px solid rgba(0,0,0,0.09);
}

/* Dot matrix — upper right, outside main rect tension */
.s03-dots {
  position: absolute;
  top: 176px;
  right: 96px;
  display: grid;
  grid-template-columns: repeat(4, 11px);
  gap: 8px;
}

.s03-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #111;
  opacity: 0.10;
  justify-self: center;
  align-self: center;
}

/* Black anchor bar — sole heavy element */
.s03-anchor {
  position: absolute;
  top: 646px;
  left: 214px;
  width: 86px;
  height: 8px;
  background: #111;
}

/* Inner rect — lower right quadrant of main rect */
.s03-inner {
  position: absolute;
  top: 770px;
  left: 450px;
  width: 500px;
  height: 194px;
  border: 1px solid rgba(0,0,0,0.11);
}

/* Measurement line */
.s03-measure {
  position: absolute;
  top: 332px;
  left: 172px;
  width: 1px;
  height: 188px;
  background: rgba(0,0,0,0.07);
}

.s03-cap-t {
  position: absolute;
  top: 331px;
  left: 166px;
  width: 12px;
  height: 1px;
  background: rgba(0,0,0,0.09);
}

.s03-cap-b {
  position: absolute;
  top: 519px;
  left: 166px;
  width: 12px;
  height: 1px;
  background: rgba(0,0,0,0.09);
}


/* ══════════════════════════════════════════════
   SLIDE 04 — CYBER LUXURY HUD
   Spatial logic: luxury-tech precision, NOT
   sci-fi. Frame border is nearly invisible.
   Corner brackets are the structural language.
   Center: one thin circle, no crosshairs.
   Restrained — feels like a precision gauge.
   ══════════════════════════════════════════════ */

.slide-04 { background: #f8f8f7; }

/* Outer HUD frame — barely visible */
.s04-frame {
  position: absolute;
  top: 96px;
  left: 82px;
  right: 116px;
  bottom: 126px;
  border: 1px solid rgba(38,182,214,0.09);
}

/* Bottom dash row — only detail below frame */
.s04-dashes {
  position: absolute;
  bottom: 132px;
  right: 172px;
  display: flex;
  gap: 7px;
  align-items: center;
}

.s04-dash { height: 1.5px; background: rgba(38,182,214,0.22); border-radius: 1px; }


/* ══════════════════════════════════════════════
   SLIDE 05 — TOPOGRAPHIC FLOW SYSTEM
   JS generates iso-contour lines of a 2D
   height field with an angled ridge. Lines
   compress near ridge crest, spread far from it.
   ══════════════════════════════════════════════ */

.slide-05 { background: #f4f5f1; }

.s05-circle {
  position: absolute;
  top: 688px;
  right: 322px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(58,76,52,0.22);
  z-index: 2;
}


/* ══════════════════════════════════════════════
   SLIDE 06 — MODULAR SAAS BLOCK SYSTEM
   Spatial logic: architectural schematic,
   NOT UI cards. SVG lines as spatial divisions.
   Some modules crop at canvas edge. Near-zero
   fill. Thin blue-tinted borders only.
   ══════════════════════════════════════════════ */

.slide-06 { background: #f7f9fd; }

.s06-module {
  position: absolute;
  border: 1px solid rgba(56,96,220,0.10);
  border-radius: 3px;
  background: rgba(200,218,255,0.022);
}

/* Module A — left anchor, standard */
.s06-a {
  top: 116px;
  left: 84px;
  width: 326px;
  height: 280px;
}

/* Module B — wide, crops right edge */
.s06-b {
  top: 84px;
  left: 436px;
  width: 720px; /* extends past 1080 — crops */
  height: 376px;
}

/* Module C — narrow left column */
.s06-c {
  top: 448px;
  left: 62px;
  width: 224px;
  height: 402px;
}

/* Module D — wide middle */
.s06-d {
  top: 428px;
  left: 314px;
  width: 684px;
  height: 296px;
}

/* Module E — crops bottom edge */
.s06-e {
  top: 1076px;
  left: 180px;
  right: 80px;
  height: 280px; /* extends past 1350 */
}

/* Tiny dot placeholders inside modules */
.s06-dot {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  border: 1px solid rgba(56,96,220,0.14);
}

/* Arrow suggestion */
.s06-arrow {
  position: absolute;
  width: 18px;
  height: 1px;
  background: rgba(56,96,220,0.12);
}

.s06-arrow::after {
  content: '';
  position: absolute;
  right: 0;
  top: -3px;
  border-top: 3px solid transparent;
  border-bottom: 3px solid transparent;
  border-left: 4px solid rgba(56,96,220,0.18);
}


/* ══════════════════════════════════════════════
   SLIDE 07 — BRUTALIST MINIMAL TECH
   Spatial logic: Swiss poster composition.
   ONE primary mass (black rectangle, top-right).
   ONE secondary whisper-line (horizontal, left).
   NOTHING else. Power is in what is absent.
   ══════════════════════════════════════════════ */

.slide-07 { background: #ffffff; }

/* Primary mass — bleeds off right edge */
.s07-mass {
  position: absolute;
  top: 144px;
  right: 0;
  width: 488px;
  height: 424px;
  background: #111111;
}

/* Single balancing line — optical counterweight */
.s07-line {
  position: absolute;
  top: 776px;
  left: 80px;
  width: 380px;
  height: 1px;
  background: rgba(0,0,0,0.15);
}

/* Small black square — far lower-left, creates tension */
.s07-sq {
  position: absolute;
  bottom: 184px;
  left: 80px;
  width: 12px;
  height: 12px;
  background: #111;
}


/* ══════════════════════════════════════════════
   SLIDE 08 — MOTION GRAPHIC STRUCTURES
   JS generates streamlines from a flow field
   with a convergence sink. Paths sweep from
   left, arc toward focal zone at center-right,
   then exit. Implies movement without animation.
   ══════════════════════════════════════════════ */

.slide-08 { background: #f8f8f8; }

/* Single corner bracket — top-right only */
.s08-corner {
  position: absolute;
  top: 84px;
  right: 104px;
  width: 36px;
  height: 36px;
  border-top: 1px solid rgba(120,64,230,0.18);
  border-right: 1px solid rgba(120,64,230,0.18);
}

/* Hair line below corner */
.s08-hair {
  position: absolute;
  top: 102px;
  right: 168px;
  width: 54px;
  height: 1px;
  background: rgba(120,64,230,0.12);
}

</style>
</head>
<body>

<div class="viewer">
  <div class="viewer-header">
    <span class="v-label">Layout Tests v2</span>
    <span class="v-label" id="counter">01 / 08</span>
  </div>

  <div class="viewport">
    <div class="track" id="track">

      <!-- ═══════════════════════ SLIDE 01 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-01">
          <div class="slide-label" style="top:62px;left:76px">01</div>
          <div class="s01-frame"></div>
          <div class="s01-bracket"></div>
          <div class="s01-accent"></div>
          <div class="s01-float-line"></div>
          <div class="s01-ticks-l">
            <div class="s01-tick" style="width:12px"></div>
            <div class="s01-tick" style="width:7px"></div>
            <div class="s01-tick" style="width:12px"></div>
            <div class="s01-tick" style="width:7px"></div>
            <div class="s01-tick" style="width:12px"></div>
          </div>
          <div class="s01-dots">
            <div class="s01-dot"></div><div class="s01-dot"></div><div class="s01-dot"></div>
            <div class="s01-dot"></div><div class="s01-dot"></div><div class="s01-dot"></div>
            <div class="s01-dot"></div><div class="s01-dot"></div><div class="s01-dot"></div>
          </div>
          <div class="s01-lines">
            <div class="s01-hline" style="width:48px"></div>
            <div class="s01-hline" style="width:34px"></div>
            <div class="s01-hline" style="width:21px"></div>
          </div>
          <div class="s01-circle"></div>
          <div class="s01-ticks-r">
            <div class="s01-rtick" style="width:16px"></div>
            <div class="s01-rtick" style="width:9px"></div>
            <div class="s01-rtick" style="width:16px"></div>
            <div class="s01-rtick" style="width:9px"></div>
            <div class="s01-rtick" style="width:16px"></div>
          </div>
          <div class="slide-label" style="bottom:68px;left:76px;opacity:0.16">Luxury Frame Grid</div>
        </div>
      </div>

      <!-- ═══════════════════════ SLIDE 02 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-02">
          <div class="slide-label" style="top:62px;left:80px;color:rgba(80,70,140,0.25)">02</div>
          <div class="s02-panel s02-a"></div>
          <div class="s02-panel s02-b"></div>
          <div class="s02-panel s02-c"></div>
          <div class="slide-label" style="bottom:68px;left:80px;opacity:0.14;color:rgba(80,70,140,0.4)">Soft Glassmorphic Panels</div>
        </div>
      </div>

      <!-- ═══════════════════════ SLIDE 03 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-03">
          <div class="slide-label" style="top:62px;left:76px">03</div>
          <div class="s03-rect"></div>
          <div class="s03-dots">
            <div class="s03-dot"></div><div class="s03-dot"></div><div class="s03-dot"></div><div class="s03-dot"></div>
            <div class="s03-dot"></div><div class="s03-dot"></div><div class="s03-dot"></div><div class="s03-dot"></div>
          </div>
          <div class="s03-anchor"></div>
          <div class="s03-inner"></div>
          <div class="s03-measure"></div>
          <div class="s03-cap-t"></div>
          <div class="s03-cap-b"></div>
          <!-- Large SVG circle arc entering from bottom-right -->
          <svg style="position:absolute;inset:0;width:1080px;height:1350px;pointer-events:none" viewBox="0 0 1080 1350">
            <circle cx="1060" cy="1230" r="566" stroke="rgba(0,0,0,0.08)" stroke-width="0.8" fill="none"/>
            <!-- Single horizontal ghost line crossing left margin -->
            <line x1="152" y1="506" x2="204" y2="506" stroke="rgba(0,0,0,0.07)" stroke-width="0.7"/>
          </svg>
          <div class="slide-label" style="bottom:68px;left:76px;opacity:0.15">Architectural Editorial Lines</div>
        </div>
      </div>

      <!-- ═══════════════════════ SLIDE 04 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-04">
          <div class="slide-label" style="top:62px;left:76px;color:rgba(38,182,214,0.45)">04</div>
          <div class="s04-frame"></div>
          <div class="s04-dashes">
            <div class="s04-dash" style="width:22px"></div>
            <div class="s04-dash" style="width:10px"></div>
            <div class="s04-dash" style="width:17px"></div>
            <div class="s04-dash" style="width:7px"></div>
          </div>
          <!-- HUD corners + single precision circle via SVG -->
          <svg style="position:absolute;inset:0;width:1080px;height:1350px;pointer-events:none" viewBox="0 0 1080 1350">
            <!-- Corner L-brackets — refined, shorter arms -->
            <path d="M82 152 L82 96 L138 96"    stroke="rgba(38,182,214,0.32)" stroke-width="1" fill="none"/>
            <path d="M998 152 L998 96 L942 96"   stroke="rgba(38,182,214,0.32)" stroke-width="1" fill="none"/>
            <path d="M82 1198 L82 1254 L138 1254" stroke="rgba(38,182,214,0.28)" stroke-width="1" fill="none"/>
            <path d="M998 1198 L998 1254 L942 1254" stroke="rgba(38,182,214,0.28)" stroke-width="1" fill="none"/>
            <!-- Frame inner ticks — very sparse -->
            <line x1="82"  y1="440" x2="98"  y2="440" stroke="rgba(38,182,214,0.14)" stroke-width="0.8"/>
            <line x1="998" y1="440" x2="982" y2="440" stroke="rgba(38,182,214,0.14)" stroke-width="0.8"/>
            <!-- Precision circle — the sole center element -->
            <circle cx="540" cy="675" r="36" stroke="rgba(38,182,214,0.22)" stroke-width="0.8" fill="none"/>
            <!-- One thin diameter mark — horizontal only (subtle, not crosshair) -->
            <line x1="496" y1="675" x2="528" y2="675" stroke="rgba(38,182,214,0.16)" stroke-width="0.7"/>
            <line x1="552" y1="675" x2="584" y2="675" stroke="rgba(38,182,214,0.16)" stroke-width="0.7"/>
          </svg>
          <div class="slide-label" style="bottom:68px;left:76px;opacity:0.14;color:rgba(38,182,214,0.5)">Cyber Luxury HUD</div>
        </div>
      </div>

      <!-- ═══════════════════════ SLIDE 05 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-05" id="slide05">
          <div class="slide-label" style="top:62px;left:76px;z-index:3">05</div>
          <div class="s05-circle"></div>
          <div class="slide-label" style="bottom:68px;left:76px;opacity:0.15;z-index:3">Topographic Flow System</div>
        </div>
      </div>

      <!-- ═══════════════════════ SLIDE 06 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-06">
          <div class="slide-label" style="top:62px;left:76px">06</div>
          <div class="s06-module s06-a">
            <!-- Content hint dots inside module A -->
            <div class="s06-dot" style="top:32px;left:28px"></div>
            <div class="s06-dot" style="top:64px;left:28px"></div>
            <div class="s06-dot" style="top:96px;left:28px"></div>
            <div class="s06-arrow" style="bottom:28px;right:28px"></div>
          </div>
          <div class="s06-module s06-b">
            <div class="s06-dot" style="top:36px;left:36px"></div>
            <div class="s06-dot" style="top:72px;left:36px"></div>
          </div>
          <div class="s06-module s06-c">
            <div class="s06-dot" style="top:28px;left:22px"></div>
            <div class="s06-dot" style="top:56px;left:22px"></div>

          </div>
          <div class="s06-module s06-d">

          </div>

      <!-- ═══════════════════════ SLIDE 07 ═══════════════════════ -->
      <div class="slide-wrapper">
        <div class="slide slide-07">
          <div class="slide-label" style="top:62px;left:76px">07</div>

      <div class="slide-wrapper">
        <div class="slide slide-08" id="slide08">

          <div class="s08-corner"></div>
          <div class="s08-hair"></div>

  <div class="nav">
    <button class="nav-btn" onclick="navigate(-1)">&#8592;</button>
    <div class="slide-name" id="slide-name">Luxury Frame Grid</div>
    <button class="nav-btn" onclick="navigate(1)">&#8594;</button>
  </div>

  <div class="dots-row" id="dots-row"></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════ */
let current = 0;
const total = 8;
const names = [
  'Luxury Frame Grid','Soft Glassmorphic Panels','Architectural Editorial Lines',
  'Cyber Luxury HUD','Topographic Flow System','Modular SaaS Block System',
  'Brutalist Minimal Tech','Motion Graphic Structures'
];

const track    = document.getElementById('track');
const dotsRow  = document.getElementById('dots-row');
const nameEl   = document.getElementById('slide-name');
const cntEl    = document.getElementById('counter');

for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsRow.appendChild(d);
}

function navigate(dir) { goTo((current + dir + total) % total); }
function goTo(i) {
  current = i;
  track.style.transform = `translateX(-${i * 540}px)`;
  nameEl.textContent = names[i];
  cntEl.textContent = String(i + 1).padStart(2, '0') + ' / 08';
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('active', j === i));
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
});


/* ═══════════════════════════════════════════════
   SLIDE 05 — TOPOGRAPHIC ISO-CONTOUR SYSTEM

   Height function: angled gaussian ridge with
   gentle modulation. Iso-contours march along
   the gradient perpendicular direction, creating
   authentic topographic compression zones.
   ═══════════════════════════════════════════════ */
(function buildTopo() {
  const W = 1080, H = 1350;

  /* Height field: elongated gaussian ridge at ~35° tilt */
  function h(px, py) {
    const nx = px / W - 0.38;
    const ny = py / H - 0.52;
    const angle = 0.60; // ~34 degrees
    const c = Math.cos(angle), s = Math.sin(angle);
    const rx = nx * c + ny * s;   /* across ridge */
    const ry = -nx * s + ny * c;  /* along ridge  */
    const core = Math.exp(-(rx * rx * 88 + ry * ry * 9));
    /* Gentle undulation for organic look */
    const wave = Math.sin(nx * 9 + ny * 5) * 0.045
               + Math.cos(nx * 6 - ny * 8 + 1.3) * 0.030;
    return core + wave;
  }

  /* Numerical gradient */
  function grad(px, py) {
    const e = 1.8;
    return {
      gx: (h(px + e, py) - h(px - e, py)) / (2 * e),
      gy: (h(px, py + e) - h(px, py - e)) / (2 * e)
    };
  }

  /* March iso-contour from seed point, always rightward */
  function contour(x0, y0, dt, maxSteps) {
    let x = x0, y = y0;
    const pts = [[x, y]];
    for (let s = 0; s < maxSteps; s++) {
      const { gx, gy } = grad(x, y);
      const mag = Math.sqrt(gx * gx + gy * gy) + 5e-4;
      /* Perpendicular direction — pick rightward variant */
      let tx = -gy / mag, ty = gx / mag;
      if (tx < 0) { tx = -tx; ty = -ty; }
      x += tx * dt;
      y += ty * dt;
      if (x < -40 || x > W + 40 || y < -60 || y > H + 60) break;
      pts.push([x, y]);
    }
    return pts;
  }

  /* Find starting Y on left edge closest to iso-level c */
  function seedY(c) {
    let best = 80, bestDiff = Infinity;
    for (let y = 80; y < H - 80; y += 8) {
      const diff = Math.abs(h(0, y) - c);
      if (diff < bestDiff) { bestDiff = diff; best = y; }
    }
    return best;
  }

  /* Build SVG */
  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.style.cssText = 'position:absolute;inset:0;pointer-events:none';

  /* Sample iso-levels across the field range */
  const numLines = 62;
  const levels = [];
  /* Ridge peak ≈ 1.0, outer edges → 0. Sample 0.03 to 0.97 range */
  for (let i = 0; i < numLines; i++) {
    const t = i / (numLines - 1);
    /* Sqrt spacing: denser near peak (high curvature) */
    levels.push(0.025 + Math.pow(t, 0.55) * 0.95);
  }

  levels.forEach((c, idx) => {
    const y0 = seedY(c);
    const pts = contour(0, y0, 5.5, 320);
    if (pts.length < 5) return;

    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;

    /* Use quadratic smoothing for cleaner curves */
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      d += ` Q ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
    }
    if (pts.length > 1) {
      const last = pts[pts.length - 1];
      d += ` L ${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
    }

    /* Opacity: peaks near ridge (high c), fades outward */
    /* Center lines (c ≈ 0.7–0.9) are slightly more visible */
    const centeredness = 1 - Math.abs(c - 0.78) / 0.78;
    const opacity = 0.035 + centeredness * 0.09;

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', `rgba(52,68,46,${opacity.toFixed(3)})`);
    path.setAttribute('stroke-width', '0.75');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });

  document.getElementById('slide05').insertBefore(svg, document.getElementById('slide05').firstChild);
})();


/* ═══════════════════════════════════════════════
   SLIDE 08 — MOTION GRAPHIC STRUCTURES

   Flow field with convergence sink at center-right.
   Streamlines integrate along the field direction,
   creating natural arc and convergence behavior.
   Paths vary in opacity and weight for depth.
   ═══════════════════════════════════════════════ */
(function buildMotion() {
  const W = 1080, H = 1350;

  /* Flow field: horizontal drift + convergence toward focal zone */
  function field(px, py) {
    const nx = px / W, ny = py / H;

    /* Base: leftward horizontal flow */
    let vx = 1.0, vy = 0.0;

    /* Primary convergence sink at (0.65, 0.50) */
    const sx = nx - 0.65, sy = ny - 0.50;
    const sr = Math.sqrt(sx * sx + sy * sy) + 0.015;
    vx += -sx * 0.55 / (sr + 0.06);
    vy += -sy * 0.55 / (sr + 0.06);

    /* Subtle clockwise rotation — creates sweeping arcs */
    vx += -sy * 0.18 / (sr + 0.12);
    vy +=  sx * 0.18 / (sr + 0.12);

    /* Secondary gentle drift at (0.25, 0.30) — upper spread */
    const dx = nx - 0.25, dy = ny - 0.30;
    const dr = Math.sqrt(dx * dx + dy * dy) + 0.02;
    vy += dy * 0.12 / (dr + 0.08);

    const mag = Math.sqrt(vx * vx + vy * vy);
    if (mag < 1e-4) return { vx: 1, vy: 0 };
    return { vx: vx / mag * 7, vy: vy / mag * 7 };
  }

  function streamline(x0, y0, maxSteps) {
    let x = x0, y = y0;
    const pts = [[x, y]];
    for (let s = 0; s < maxSteps; s++) {
      const { vx, vy } = field(x, y);
      x += vx;
      y += vy;
      if (x < -40 || x > W + 40 || y < -80 || y > H + 80) break;
      pts.push([x, y]);
    }
    return pts;
  }

  function ptsToPath(pts) {
    if (pts.length < 3) return '';
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      d += ` Q ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
    }
    return d;
  }

  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.style.cssText = 'position:absolute;inset:0;pointer-events:none';

  /* Seed points along left edge and top-left area */
  const seeds = [];
  /* Left edge — evenly distributed */
  for (let i = 0; i < 22; i++) {
    seeds.push({ x: 0, y: 120 + (i / 21) * 1110 });
  }
  /* Top-left arc — enters from top */
  for (let i = 0; i < 8; i++) {
    seeds.push({ x: 60 + i * 90, y: 0 });
  }
  /* Bottom-left */
  for (let i = 0; i < 5; i++) {
    seeds.push({ x: 0 + i * 40, y: H - 60 - i * 40 });
  }

  seeds.forEach((s, idx) => {
    const pts = streamline(s.x, s.y, 200);
    if (pts.length < 6) return;

    const d = ptsToPath(pts);
    if (!d) return;

    /* Opacity: highest for paths that cross the focal convergence zone */
    /* Approximate: lines starting from mid-left have higher visibility */
    const relY = s.y / H;
    const midness = 1 - Math.abs(relY - 0.50) * 1.8;
    const opacity = 0.055 + Math.max(0, midness) * 0.28;
    const sw = (0.55 + Math.max(0, midness) * 0.7).toFixed(2);

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', `rgba(112,52,228,${Math.min(0.42, opacity).toFixed(3)})`);
    path.setAttribute('stroke-width', sw);
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });

  document.getElementById('slide08').insertBefore(svg, document.getElementById('slide08').firstChild);
})();
</script>
