/* ── SVG drop-shadow filters (CSS box-shadow is broken in html2canvas) ───── */
/* Applied via class on cards/stamps. The actual <filter> defs live in the
   sprite block injected at the top of <body>. */
.shadow-sm{filter:url(#shadow-sm)}
.shadow-md{filter:url(#shadow-md)}
.shadow-lg{filter:url(#shadow-lg)}

/* v2: auto-apply subtle shadow to existing card/stamp surfaces.
   Slides can opt out via effects.shadow = "none" (handled in templates). */
.sub-stat-card, .sub-bento-card, .sub-comment-mock, .sub-download-card,
.tip-blk, .step-box, .faq-item, .lnum-item, .cascade-quote,
.chrome-badge-stamp, .proof-card{
  filter:url(#shadow-sm);
}

/* ── SVG icon system base styling ────────────────────────────────────────── */
/* Icons reference sprite symbols via <use href="#icon-name"/>.
   Use currentColor in SVG paths so size + color come from CSS. */
.icon{
  display:inline-block;width:1em;height:1em;
  fill:currentColor;vertical-align:middle;flex-shrink:0;
}
.icon-lg{width:1.4em;height:1.4em}
.icon-xl{width:2em;height:2em}

/* ════════════════════════════════════════════════════════════════════════════
   v3 UPGRADE — P0/P1 BUG FIXES + 5-TIER TYPE SYSTEM + 24 NEW LAYOUTS
   ════════════════════════════════════════════════════════════════════════════ */

/* ── P0 FIX: LIGHT SYSTEM EXPORT VISIBILITY ─────────────────────────────── */
/* html2canvas flattens mix-blend-mode → low-opacity elements vanish on white  */
.light-system .slide::before                 { opacity:0.12 !important; }
.light-system .diag-band                     { opacity:0.14 !important; }
.light-system .vol-light                     { opacity:0.08 !important; }
.light-system .glow-orb                      { background:radial-gradient(circle,rgba(0,0,0,0.06) 0%,transparent 70%);opacity:0.8 !important; }
.light-system .geo-ribbon-flow::before       { opacity:0.22 !important; }
.light-system .geo-ribbon-flow::after        { opacity:0.12 !important; }
.light-system .geo-gradient-bands            { opacity:0.22 !important; }
.light-system .geo-iso-grid                  { opacity:0.16 !important; }
.light-system .geo-topo-lines                { opacity:0.22 !important; }
.light-system .geo-starfield                 { opacity:0.75 !important; }
/* SVG blob opacity is now set at render time via blob_op dict — mild saturate only */
.light-system .svg-blob                      { filter:saturate(1.4) !important; }
.light-system .deco-starburst                { opacity:1 !important; }
.light-system .deco-corner-tl,
.light-system .deco-corner-br                { opacity:0.55 !important; }
.light-system .deco-stamp                    { opacity:1 !important; }
.light-system .chrome-badge-stamp            { opacity:1 !important; }

/* ── P0 FIX: TERMINAL ALWAYS DARK — identity, never adapts to system ──────  */
.term-body {
  background:#0d0d12 !important;
  color:#e0e0e0 !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-top:none !important;
}
.term-bar { background:rgba(0,0,0,0.82) !important; }

/* ── P0 FIX: DISPLAY HEADLINE CLIP ─────────────────────────────────────── */
/* Negative letter-spacing pushes chars outside bounding box → export clips  */
.hook-display,.stat-num,.poster-display,.term-headline,
.lnum-headline,.chk-headline,.cta-question {
  overflow:visible !important;
  padding-right:0.08em;
}
.hook-wrap,.stat-wrap,.poster-wrap,.term-wrap,
.lnum-wrap,.chk-wrap,.cta-wrap { overflow:visible; }

/* ── P1 FIX: BODY TEXT HIERARCHY (4-5:1 ratio vs display) ──────────────── */
.hook-body,.ba-sub,.tip-blk-text,.faq-a,
.proof-quote,.stat-context,.timeline-desc,
.step-desc,.lnum-desc,.icong-tile .ig-desc {
  font-size:clamp(13px,2.2cqw,15px) !important;
  font-weight:300;
  line-height:1.50;
}
.step-title { font-size:clamp(13px,2.4cqw,15px); }
.lnum-title { font-size:clamp(14px,2.8cqw,17px); }

/* ── PHASE 2: 5-TIER TYPE SYSTEM ────────────────────────────────────────── */
/* New layouts use these classes. Existing layouts keep their scoped classes. */
.t-display {
  font-family:var(--font-display);font-size:clamp(48px,10cqw,84px);
  font-weight:700;letter-spacing:-0.04em;line-height:0.88;
  overflow:visible;padding-right:0.06em;
}
.t-subhead {
  font-family:var(--font-display);font-size:clamp(22px,4cqw,32px);
  font-weight:700;letter-spacing:-0.01em;line-height:1.10;
}
.t-body {
  font-family:var(--font-body);font-size:clamp(13px,2.2cqw,15px);
  font-weight:300;letter-spacing:0;line-height:1.55;max-width:36ch;
}
.t-label {
  font-family:var(--font-mono);font-size:11px;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);
}
.t-mono {
  font-family:var(--font-mono);font-size:13px;font-weight:500;
  letter-spacing:0;line-height:1.6;
}

/* ── PHASE 2: SYSTEM FAMILY PERSONALITIES (.sys-{family} on html+body) ──── */
.sys-brutalist .t-display,
.sys-brutalist .hook-display,
.sys-brutalist .poster-display {
  text-transform:uppercase;letter-spacing:-0.055em;line-height:0.83;
}
.sys-brutalist .slide { --pad-x:28px;--pad-y:28px;--pad-bottom:80px; }
.sys-cyberpunk .t-display,
.sys-cyberpunk .hook-display,
.sys-cyberpunk .stat-num { font-family:var(--font-mono); }
.sys-light .hook-display   { font-size:clamp(26px,5.5cqw,38px); }
.sys-light .poster-display { font-size:clamp(28px,7cqw,48px); }

/* ── PHASE 3: NEW LAYOUT CSS ─────────────────────────────────────────────── */

/* slide-full-bleed-type */
.fbt-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;position:relative;z-index:5}
.fbt-display{font-family:var(--font-display);font-size:clamp(72px,16cqw,130px);font-weight:900;letter-spacing:-0.05em;line-height:0.85;text-align:center;overflow:visible}
.fbt-label{position:absolute;bottom:calc(var(--pad-bottom) - 16px);left:var(--pad-x);font-family:var(--font-mono);font-size:10px;letter-spacing:0.25em;text-transform:uppercase;opacity:0.42;z-index:10}

/* slide-diagonal-split */
.diags-wrap{position:relative;flex:1;min-height:0;width:100%;overflow:hidden}
.diags-bg{position:absolute;inset:0;clip-path:polygon(0 0,62% 0,38% 100%,0 100%);background:var(--bg-mid);z-index:0}
.diags-content{position:absolute;left:0;top:0;width:56%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad-x);z-index:2}
.diags-side{position:absolute;right:0;top:0;width:44%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:48px 40px 80px;z-index:2}
.diags-headline{font-family:var(--font-display);font-size:clamp(26px,5cqw,40px);font-weight:700;line-height:0.95;text-shadow:0 0 12px rgba(255,255,255,0.08);letter-spacing:-0.03em;overflow:visible}
.diags-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:16px;opacity:0.72;max-width:34ch}
.diags-stat{font-family:var(--font-display);font-size:clamp(48px,10cqw,80px);font-weight:700;color:var(--accent);line-height:0.85;letter-spacing:-0.04em;overflow:visible}
.diags-stat-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.20em;text-transform:uppercase;opacity:0.55;margin-top:8px}

/* slide-asymmetric-lockup */
.asym-wrap{display:flex;align-items:center;flex:1;min-height:0;width:100%;padding:0}
.asym-content{width:42%;max-width:420px;padding-left:0}
.asym-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.asym-kicker::before{content:'';width:20px;height:1px;background:var(--accent)}
.asym-headline{font-family:var(--font-display);font-size:clamp(26px,5.5cqw,44px);font-weight:700;line-height:0.95;text-shadow:0 0 12px rgba(255,255,255,0.08);letter-spacing:-0.03em;overflow:visible}
.asym-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:20px;opacity:0.70;max-width:32ch}

/* slide-type-over-shape */
.tos-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:5;width:100%}
.tos-headline{font-family:var(--font-display);font-size:clamp(36px,7cqw,64px);font-weight:700;line-height:0.90;letter-spacing:-0.04em;position:relative;z-index:2;max-width:820px;overflow:visible}
.tos-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:20px;opacity:0.72;max-width:32ch;position:relative;z-index:2}

/* slide-stacked-type */
.stype-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:0;width:100%}
.stype-line-1{font-family:var(--font-display);font-size:clamp(48px,10cqw,84px);font-weight:900;line-height:0.88;letter-spacing:-0.04em;overflow:visible}
.stype-line-2{font-family:var(--font-display);font-size:clamp(30px,6cqw,48px);font-weight:700;line-height:0.98;opacity:0.88}
.stype-line-3{font-family:var(--font-body);font-size:clamp(14px,2.5cqw,18px);font-weight:300;line-height:1.45;opacity:0.60;margin-top:20px;max-width:40ch}
.stype-line-4{font-family:var(--font-mono);font-size:11px;letter-spacing:0.20em;text-transform:uppercase;color:var(--accent);margin-top:10px}

/* slide-corner-manifesto */
.cman-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;width:100%;padding-bottom:8px}
.cman-headline{font-family:var(--font-display);font-size:clamp(26px,5cqw,44px);font-weight:700;line-height:0.95;max-width:72%;letter-spacing:-0.03em;overflow:visible}
.cman-body{font-size:14px;font-weight:300;margin-top:14px;max-width:45%;opacity:0.65;line-height:1.55}

/* slide-data-wall */
.dwall-wrap{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%}
.dwall-card{display:flex;flex-direction:column;justify-content:center;padding:22px 20px;background:rgba(255,255,255,0.03)}
.light-system .dwall-card{background:rgba(0,0,0,0.04)}
.dwall-num{font-family:var(--font-display);font-size:clamp(28px,5cqw,48px);font-weight:900;line-height:1;color:var(--text-primary);overflow:visible}
.dwall-num .unit{font-size:0.45em;color:var(--accent);margin-left:2px}
.dwall-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.20em;text-transform:uppercase;opacity:0.48;margin-top:6px}

/* slide-side-by-side */
.sbs-wrap{flex:1;min-height:0;display:flex;width:100%}
.sbs-left{width:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 36px 72px;text-align:center}
.sbs-right{width:50%;display:flex;flex-direction:column;justify-content:center;padding:32px 36px 72px;border-left:1px solid rgba(255,255,255,0.08);background:var(--bg-mid)}
.light-system .sbs-right{border-left-color:rgba(0,0,0,0.08)}
.sbs-big{font-family:var(--font-display);font-size:clamp(64px,12cqw,120px);font-weight:900;line-height:0.83;letter-spacing:-0.05em;overflow:visible}
.sbs-big .unit{font-size:0.35em;color:var(--accent);vertical-align:top;margin-top:18px;display:inline-block}
.sbs-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.20em;text-transform:uppercase;opacity:0.50;margin-top:10px}
.sbs-headline{font-family:var(--font-display);font-size:clamp(20px,3.8cqw,26px);font-weight:700;line-height:1.1}
.sbs-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:14px;opacity:0.70;max-width:34ch}

/* slide-frame-within-frame */
.fwf-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.fwf-frame{width:78%;height:78%;border:1px solid rgba(255,255,255,0.18);display:flex;flex-direction:column;justify-content:center;padding:44px;position:relative}
.light-system .fwf-frame{border-color:rgba(0,0,0,0.18)}
.fwf-kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.fwf-quote{font-family:var(--font-display);font-size:clamp(18px,3.5cqw,26px);font-weight:700;line-height:1.30;font-style:italic}
.fwf-quote em{color:var(--accent);font-style:normal}
.fwf-attr{position:absolute;bottom:20px;right:24px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;opacity:0.40}

/* slide-massive-number */
.mn-wrap{flex:1;min-height:0;position:relative;width:100%;overflow:hidden}
.mn-number{position:absolute;left:-4%;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:clamp(180px,34cqw,310px);font-weight:900;line-height:0.80;opacity:0.12;z-index:0;color:var(--text-primary);overflow:visible;pointer-events:none;user-select:none}
.mn-content{position:relative;z-index:2;width:52%;margin-left:auto;padding:0 var(--pad-x) 0 28px;display:flex;flex-direction:column;justify-content:center;height:100%}
.mn-stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.20em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.mn-headline{font-family:var(--font-display);font-size:clamp(22px,4.5cqw,32px);font-weight:700;line-height:1.1}
.mn-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:14px;opacity:0.68;max-width:34ch}
.mn-source{font-family:var(--font-mono);font-size:10px;opacity:0.30;margin-top:14px;letter-spacing:0.07em;text-transform:uppercase}

/* slide-terminal-fullscreen */
.tfs-wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;overflow:hidden;margin:0 calc(-1 * var(--pad-x));width:calc(100% + 2 * var(--pad-x))}
.tfs-chrome{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(0,0,0,0.85);border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0}
.tfs-dot{width:11px;height:11px;border-radius:50%}
.tfs-dot.r{background:#ff5f5f}.tfs-dot.y{background:#feca57}.tfs-dot.g{background:#2ee59a}
.tfs-tab{font-family:var(--font-mono);font-size:10px;opacity:0.35;margin-left:8px;letter-spacing:0.04em}
.tfs-body{flex:1;padding:20px 24px 32px;font-family:var(--font-mono);font-size:clamp(11px,2cqw,13px);line-height:1.7;overflow:hidden;background:#0d0d12;color:#e0e0e0}
.tfs-cmd{color:#ff7eb3;font-weight:500}
.tfs-ok{color:#4ecdc4;margin-top:4px}.tfs-warn{color:#feca57;margin-top:4px;font-weight:500}
.tfs-err{color:#ff7eb3;margin-top:4px}.tfs-comment{opacity:0.30;margin-top:4px}
.tfs-cursor::after{content:'_';color:var(--accent)}

/* slide-editorial-column */
.ec-wrap{flex:1;min-height:0;display:flex;gap:0;width:100%;align-items:center}
.ec-left{width:45%;padding-right:28px}
.ec-divider{width:1px;height:62%;background:rgba(255,255,255,0.10);align-self:center;flex-shrink:0}
.light-system .ec-divider{background:rgba(0,0,0,0.12)}
.ec-right{flex:1;padding-left:28px}
.ec-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:0.20em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.ec-kicker::before{content:'';width:20px;height:1px;background:var(--accent)}
.ec-headline{font-family:var(--font-display);font-size:clamp(22px,4.5cqw,30px);font-weight:700;line-height:1.1}
.ec-body{font-size:clamp(13px,2.2cqw,15px);font-weight:300;line-height:1.55;margin-top:14px;opacity:0.70;max-width:34ch}
.ec-quote{font-family:var(--font-display);font-size:clamp(16px,3cqw,22px);font-weight:300;font-style:italic;line-height:1.45}
.ec-quote em{color:var(--accent);font-style:normal}
.ec-attr{font-family:var(--font-mono);font-size:10px;opacity:0.42;letter-spacing:0.08em;margin-top:12px;text-transform:uppercase}

/* slide-badge-grid */
.badgeg-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;gap:0}
.badgeg-headline{font-family:var(--font-display);font-size:clamp(20px,4cqw,26px);font-weight:700;line-height:1.1;margin-bottom:6px}
.badgeg-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid rgba(255,255,255,0.08)}
.light-system .badgeg-row{border-top-color:rgba(0,0,0,0.08)}
.badgeg-icon{width:32px;height:32px;flex-shrink:0;color:var(--accent);display:flex;align-items:center;justify-content:center}
.badgeg-title{font-family:var(--font-display);font-size:16px;font-weight:700}
.badgeg-desc{font-size:13px;font-weight:300;opacity:0.58;margin-left:auto;text-align:right;max-width:48%;line-height:1.4}

/* slide-contrast-knockout */
.ck-wrap{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;margin:0 calc(-1 * var(--pad-x));width:calc(100% + 2 * var(--pad-x));margin-top:calc(-1 * var(--pad-y))}
.ck-top{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px var(--pad-x) 20px;background:var(--bg-base);color:var(--text-primary)}
.ck-bottom{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px var(--pad-x) 80px;background:var(--accent);color:var(--bg-base)}
.ck-top-text{font-family:var(--font-display);font-size:clamp(26px,5.5cqw,44px);font-weight:700;line-height:0.95;letter-spacing:-0.04em;overflow:visible}
.ck-bottom-text{font-family:var(--font-display);font-size:clamp(20px,4.2cqw,32px);font-weight:700;line-height:1.05}

/* slide-circular-quote */
.cq-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;width:100%}
.cq-circle{width:min(70%,480px);aspect-ratio:1/1;border:1px solid rgba(255,255,255,0.18);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px;text-align:center}
.light-system .cq-circle{border-color:rgba(0,0,0,0.18)}
.cq-kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:0.20em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.cq-quote{font-family:var(--font-display);font-size:clamp(15px,2.8cqw,20px);font-weight:700;line-height:1.35}
.cq-attr{position:absolute;bottom:4px;right:0;font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;opacity:0.40}

/* slide-waterfall-list */
.wfl-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;gap:0}
.wfl-headline{font-family:var(--font-display);font-size:clamp(20px,4cqw,26px);font-weight:700;line-height:1.1;margin-bottom:6px}
.wfl-item{display:flex;align-items:baseline;gap:20px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.light-system .wfl-item{border-bottom-color:rgba(0,0,0,0.08)}
.wfl-num{font-family:var(--font-display);font-size:clamp(36px,6.5cqw,64px);font-weight:700;line-height:1;color:var(--accent);opacity:0.38;min-width:68px;flex-shrink:0;letter-spacing:-0.04em;overflow:visible}
.wfl-text{font-family:var(--font-display);font-size:clamp(15px,2.8cqw,19px);font-weight:600;flex:1;line-height:1.3}
.wfl-desc{font-size:13px;font-weight:300;opacity:0.58;margin-top:3px}

/* slide-angled-text */
.at-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.at-content{transform:rotate(-15deg);max-width:72%;text-align:center}
.at-headline{font-family:var(--font-display);font-size:clamp(32px,6cqw,56px);font-weight:700;line-height:1.0;overflow:visible}
.at-body{font-size:clamp(13px,2.4cqw,16px);font-weight:300;line-height:1.5;margin-top:16px;opacity:0.68}

/* slide-minimal-card-stack */
.mcs-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;gap:0}
.mcs-headline{font-family:var(--font-display);font-size:clamp(20px,4cqw,26px);font-weight:700;line-height:1.1;margin-bottom:22px}
.mcs-card{width:88%;padding:20px 26px;border-left:2px solid var(--accent)}
.mcs-card+.mcs-card{margin-left:18px;border-left-color:rgba(255,255,255,0.26);margin-top:14px}
.mcs-card+.mcs-card+.mcs-card{margin-left:36px;border-left-color:rgba(255,255,255,0.13)}
.light-system .mcs-card+.mcs-card{border-left-color:rgba(0,0,0,0.22)}
.light-system .mcs-card+.mcs-card+.mcs-card{border-left-color:rgba(0,0,0,0.10)}
.mcs-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:5px}
.mcs-desc{font-size:13px;font-weight:300;opacity:0.60;line-height:1.5}

/* slide-logo-wall */
.lw-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:26px}
.lw-headline-text{font-family:var(--font-mono);font-size:12px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.45;text-align:center}
.lw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:80%}
.lw-logo{height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;font-weight:700;opacity:0.22;letter-spacing:0.04em;text-align:center}

/* slide-receipt */
.rcpt-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.rcpt-paper{width:72%;max-width:560px;background:#fff;color:#111;padding:28px;font-family:var(--font-mono);font-size:12px;line-height:1.9;border-top:3px dashed #bbb;border-bottom:3px dashed #bbb}
.rcpt-title{font-family:var(--font-display);font-size:14px;font-weight:700;text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #ccc}
.rcpt-line{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #e5e5e5}
.rcpt-total{border-top:2px solid #111;border-bottom:none;font-weight:700;font-size:14px;margin-top:6px;padding-top:7px}

/* slide-polaroid-grid */
.pg-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.pg-card{background:#fff;padding:10px 10px 40px;box-shadow:0 6px 28px rgba(0,0,0,0.32);width:36%;flex-shrink:0}
.pg-card:nth-child(1){transform:rotate(-2.5deg)}.pg-card:nth-child(2){transform:rotate(2deg);margin-top:26px}.pg-card:nth-child(3){transform:rotate(-1.5deg)}
.pg-img{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff;overflow:hidden}
.pg-caption{font-size:11px;color:#444;margin-top:10px;font-family:var(--font-mono);text-align:center}

/* slide-tag-cloud */
.tc-wrap{flex:1;min-height:0;position:relative;width:100%;overflow:hidden}
.tc-word{position:absolute;font-family:var(--font-display);font-weight:700;white-space:nowrap;color:var(--accent)}

/* slide-morse-code */
.mc-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:16px}
.mc-headline{font-family:var(--font-display);font-size:clamp(20px,4cqw,26px);font-weight:700;margin-bottom:4px;text-align:center}
.mc-code{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;max-width:82%}
.mc-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;flex-shrink:0}
.mc-dash{width:22px;height:8px;background:var(--accent);display:inline-block;border-radius:2px;flex-shrink:0}
.mc-gap{width:12px;display:inline-block}.mc-word-gap{width:26px;display:inline-block}
.mc-decoded{font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.40;text-align:center}

/* slide-scroll-code */
.sc-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%}
.sc-headline{font-family:var(--font-display);font-size:clamp(20px,4cqw,26px);font-weight:700;margin-bottom:16px}
.sc-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--font-mono);font-size:11px;opacity:0.42}
.sc-lang-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
.sc-block{background:rgba(0,0,0,0.45);border-radius:10px;padding:20px 22px;font-family:var(--font-mono);font-size:clamp(11px,2cqw,13px);line-height:1.8;overflow:hidden}
.light-system .sc-block{background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.10)}
.sc-kw{color:var(--accent)}.sc-cmt{opacity:0.35;font-style:italic}
.sc-str{color:var(--text-primary);opacity:0.82}.sc-fn{color:#4ecdc4}.sc-num2{color:#feca57}

/* ══ LAYOUT: CROSS-SLIDE CONNECTOR ══ */
.conn-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;position:relative;z-index:5;padding-left:8%}
.conn-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:10px}

<script>
let cur = 0;
const slides = document.querySelectorAll('#track .slide');
const total = slides.length;
function showSlide(i) {
  cur = Math.max(0, Math.min(i, total - 1));
  document.getElementById('track').style.transform = `translateX(-${cur * 100}%)`;
}
function move(dir) { showSlide(cur + dir); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowLeft') move(-1);
});

async function exportZip() {
  const zip = new JSZip();
  const wrap = document.getElementById('wrap');
  const scale = Math.round((1080 / wrap.getBoundingClientRect().width) * 10) / 10;
  for (let i = 0; i < total; i++) {
    showSlide(i);
    await new Promise(r => setTimeout(r, 600));
    const canvas = await html2canvas(wrap, { scale, useCORS: true, allowTaint: true, backgroundColor: null, logging: false });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png', 1.0));
    zip.file(`slide_${String(i + 1).padStart(2, '0')}.png`, blob);
  }
  const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(content), download: 'carousel.zip' });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showSlide(cur);
}
</script>
