<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>s25 SWISS BRUT</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Crimson+Pro:wght@400;500;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif:wght@400;500;600&family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(145deg,#ffffff,#f2f2f2);
  color:#111111;
  font-family:'JetBrains Mono',sans-serif;
  display:flex;flex-direction:column;height:100vh;
}
.accent-bar{height:3px;background:#ff0015;flex-shrink:0}
.body{flex:1;display:flex;flex-direction:column;padding:36px 44px;gap:0;overflow:hidden}
.sys-id{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:0.22em;text-transform:uppercase;
  color:#ff0015;opacity:0.75;margin-bottom:10px;
}
.sys-name{
  font-family:'Archivo',sans-serif;font-size:clamp(36px,6vw,64px);
  font-weight:700;line-height:1.0;color:#111111;margin-bottom:18px;
}
.sys-sample{
  font-family:'JetBrains Mono',sans-serif;font-size:14px;
  line-height:1.65;color:#111111;opacity:0.50;
  max-width:480px;margin-bottom:auto;padding-bottom:24px;
}
.colors{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px;flex-shrink:0}
.swatch{display:flex;flex-direction:column;gap:5px}
.swatch-box{
  width:44px;height:44px;border-radius:6px;
  border:1px solid rgba(255,255,255,0.12);
}
.swatch-role{
  font-family:'JetBrains Mono',monospace;font-size:8px;
  letter-spacing:0.12em;text-transform:uppercase;
  color:#111111;opacity:0.35;
}
.swatch-hex{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  color:#111111;opacity:0.55;
}
.fonts{
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:18px;display:grid;
  grid-template-columns:1fr 1fr;gap:14px;flex-shrink:0;
}
.font-item{display:flex;flex-direction:column;gap:3px}
.font-role{
  font-family:'JetBrains Mono',monospace;font-size:8px;
  letter-spacing:0.14em;text-transform:uppercase;
  color:#111111;opacity:0.35;
}
.font-name{font-size:13px;font-weight:600;color:#111111}
.font-name.display{font-family:'Archivo',sans-serif}
.font-name.body{font-family:'JetBrains Mono',sans-serif}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="body">
  <div class="sys-id">S25 · SWISS BRUT</div>
  <div class="sys-name">SWISS BRUT</div>
  <div class="sys-sample">
    El candidato ideal combina experiencia técnica con comunicación clara.<br>
    <em style="font-style:italic;opacity:0.7">The quick brown fox jumps — 0123456789</em>
  </div>
  <div class="colors">
    <div class="swatch">
      <div class="swatch-box" style="background:#ff0015"></div>
      <div class="swatch-role">Accent</div>
      <div class="swatch-hex">#ff0015</div>
    </div>
    <div class="swatch">
      <div class="swatch-box" style="background:#ffffff;border-color:rgba(255,255,255,0.25)"></div>
      <div class="swatch-role">Base</div>
      <div class="swatch-hex">#ffffff</div>
    </div>
    <div class="swatch">
      <div class="swatch-box" style="background:#f2f2f2;border-color:rgba(255,255,255,0.18)"></div>
      <div class="swatch-role">Mid</div>
      <div class="swatch-hex">#f2f2f2</div>
    </div>
  </div>
  <div class="fonts">
    <div class="font-item">
      <div class="font-role">Display</div>
      <div class="font-name display">Archivo</div>
    </div>
    <div class="font-item">
      <div class="font-role">Body</div>
      <div class="font-name body">JetBrains Mono</div>
    </div>
  </div>
</div>
</body>
</html>
