<div class="pw-wrap"><div class="pw-grid"></div></div>

<style>
.pw-wrap {
  position: absolute; inset: 0;
  overflow: hidden; pointer-events: none; z-index: 1;
  perspective: 600px;
}
.pw-grid {
  position: absolute;
  width: 200%; height: 200%;
  left: -50%; top: -50%;
  background-image:
    linear-gradient(to right, var(--accent) 1px, transparent 1px),
    linear-gradient(to bottom, var(--accent) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: var(--geo-opacity, 0.08);
  transform: rotateX(60deg) rotateZ(-15deg);
  -webkit-mask-image: linear-gradient(120deg, transparent 12%, rgba(0,0,0,0.55) 50%, black 78%);
          mask-image: linear-gradient(120deg, transparent 12%, rgba(0,0,0,0.55) 50%, black 78%);
}
</style>

CUSTOMIZATION:
