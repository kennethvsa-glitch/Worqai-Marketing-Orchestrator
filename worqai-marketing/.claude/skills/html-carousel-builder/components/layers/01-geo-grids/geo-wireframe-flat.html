<!--
LAYER: WIREFRAME FLAT
Variant of perspective wireframe without 3D rotation.
Best for: light systems, Swiss grids, editorial layouts.
-->

<div class="wf-flat"></div>

<style>
.wf-flat {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 1;
  background-image:
    linear-gradient(to right, var(--accent-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--accent-line) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: var(--geo-opacity, 0.08);
}
</style>

<!--
CUSTOMIZATION:
- background-size: 40px (dense) to 120px (sparse)
- Use --accent-line for subtle, --accent-soft for visible
