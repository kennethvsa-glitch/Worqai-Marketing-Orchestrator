<!--
MOCK-UI: TERMINAL WINDOWS
Purpose: Windows-style command prompt.
-->

<div class="terminal-win">
  <div class="term-win-bar">C:\\Users\\WorqAI&gt; parser.exe</div>
  <div class="term-win-body">
    <p>&gt; Escaneando CV...</p>
    <p>&gt; 3 errores encontrados</p>
    <p class="win-fail">&gt; [ERROR] Formato no compatible</p>
    <p class="win-ok">&gt; [OK] Listo para optimizar</p>
    <p class="win-cursor">_</p>
  </div>
</div>

<style>
.terminal-win {
  background: var(--term-bg, #0c0c0c); border: 1px solid var(--term-border, #333);
  border-radius: 8px; overflow: hidden;
  font-family: var(--font-mono), monospace;
}
.term-win-bar {
  padding: 10px 14px; background: var(--term-bar, #1a1a1a);
  border-bottom: 1px solid var(--term-border, #333);
  font-size: 12px; color: var(--text-muted);
}
.term-win-body {
  padding: 16px 18px; font-size: 15px; line-height: 1.7;
  color: var(--term-text, #cccccc);
}
.term-win-body .win-fail { color: var(--term-red, #ff5f56); }
.term-win-body .win-ok { color: var(--term-green, #27c93f); }
.win-cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); }
</style>
