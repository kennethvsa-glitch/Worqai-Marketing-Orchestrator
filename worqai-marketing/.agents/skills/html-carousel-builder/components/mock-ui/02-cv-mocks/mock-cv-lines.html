<style>
.cv-mock {
  display: flex; flex-direction: column; gap: 10px;
  padding: 24px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
}
.cv-line {
  height: 10px; border-radius: 4px;
  background: rgba(255,255,255,0.10);
}
.cv-line.header { width: 45%; height: 14px; background: var(--text-primary); }
.cv-line.sub { width: 30%; background: var(--text-muted); }
.cv-line.full { width: 100%; }
.cv-line.mid { width: 65%; }
.cv-line.short { width: 40%; }
.cv-line.ok { background: rgba(80,255,150,0.25); }
.cv-line.warn { background: rgba(255,200,50,0.25); }
.cv-line.fail { background: rgba(255,80,80,0.25); }
.cv-gap { height: 8px; }
</style>
