<div class="terminal">
  <div class="term-bar">
    <div class="term-dots"><span></span><span></span><span></span></div>
    <span class="term-title">bash — 80x24</span>
  </div>
  <div class="term-body">
    <p><span class="prompt">$</span> worqai --scan cv.pdf</p>
    <p class="out">Parsing... 12 sections found</p>
    <p class="out ok">[PASS]  Contact info readable</p>
    <p class="out warn">[WARN] Skills section uses tables</p>
    <p class="out fail">[FAIL] No keywords matched for "Project Manager"</p>
    <p class="out">Score: 34/100 — Needs optimization</p>
    <p class="cursor">_</p>
  </div>
</div>

<style>
.terminal {
  background: rgba(0,0,0,0.40);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  overflow: hidden;
}
.term-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.term-dots { display: flex; gap: 6px; }
.term-dots span { width: 10px; height: 10px; border-radius: 50%; }
.term-dots span:nth-child(1) { background: var(--term-red, #FF5F56); }
.term-dots span:nth-child(2) { background: var(--term-yellow, #FFBD2E); }
.term-dots span:nth-child(3) { background: var(--term-green, #27C93F); }
.term-title {
  font-family: var(--font-mono), monospace;
  font-size: 11px; color: var(--text-muted);
}
.term-body {
  padding: 18px 20px;
  font-family: var(--font-mono), monospace;
  font-size: 15px; line-height: 1.7;
  color: var(--text-secondary);
}
.prompt { color: var(--accent); margin-right: 8px; }
.out { color: var(--text-secondary); }
.ok { color: var(--term-green, #27C93F); }
.warn { color: var(--term-yellow, #FFBD2E); }
.fail { color: var(--term-red, #FF5F56); }
.cursor {
  display: inline-block; width: 8px; height: 18px;
  background: var(--accent);
}
</style>
