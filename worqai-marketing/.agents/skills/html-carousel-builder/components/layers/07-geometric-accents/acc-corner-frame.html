<!--
LAYER: CORNER FRAME
L-shaped border accents at slide corners.
Best for: editorial, framed, gallery systems.
-->

<div class="corner-frame tl"></div>
<div class="corner-frame tr"></div>
<div class="corner-frame bl"></div>
<div class="corner-frame br"></div>

<style>
.corner-frame {
  position: absolute;
  width: 48px; height: 48px;
  border-color: var(--accent);
  opacity: 0.14;
  pointer-events: none; z-index: 6;
}
.corner-frame.tl { top: 28px; left: 28px; border-top: 2px solid; border-left: 2px solid; }
.corner-frame.tr { top: 28px; right: 28px; border-top: 2px solid; border-right: 2px solid; }
.corner-frame.bl { bottom: 28px; left: 28px; border-bottom: 2px solid; border-left: 2px solid; }
.corner-frame.br { bottom: 28px; right: 28px; border-bottom: 2px solid; border-right: 2px solid; }
</style>

<!--
CUSTOMIZATION:
- Use 2 corners (diagonal) or all 4
- Size: 32px (subtle) to 64px (bold)
- Opacity: 0.08 (ghost) to 0.25 (visible)
-->
