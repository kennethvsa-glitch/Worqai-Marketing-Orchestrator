<!--
LAYER: GRAIN
Found in: 6/7 best carousels
Purpose: Universal texture overlay. Use on every slide.
-->

<div class="grain"></div>

<style>
.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 220px 220px;
  opacity: var(--grain-opacity, 0.05);
  mix-blend-mode: overlay;
}
</style>

<!--
CUSTOMIZATION:
- --grain-opacity: 0.03 (light) to 0.18 (dark/lo-fi)
- On light slides: mix-blend-mode: multiply
- background-size: 300px+ for softer grain
-->
