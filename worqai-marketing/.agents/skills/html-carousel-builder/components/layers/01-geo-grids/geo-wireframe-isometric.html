<!--
LAYER: WIREFRAME ISOMETRIC
3D grid with isometric rotation (rotateX + rotateZ at 30deg increments).
Best for: tech, data, architectural systems.
-->

<div class="wf-iso-wrap"><div class="wf-iso"></div></div>

<style>
.wf-iso-wrap {
  position: absolute; inset: 0;
  overflow: hidden; pointer-events: none; z-index: 1;
  perspective: 800px;
}
.wf-iso {
  position: absolute;
  width: 200%; height: 200%;
  left: -50%; top: -50%;
  background-image:
    linear-gradient(to right, var(--accent) 1px, transparent 1px),
    linear-gradient(to bottom, var(--accent) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: var(--geo-opacity, 0.08);
  transform: rotateX(55deg) rotateZ(-30deg);
}
</style>
