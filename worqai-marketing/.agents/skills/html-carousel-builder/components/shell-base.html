<!--
STRUCTURAL SHELL: BASE HTML WRAPPER
Found in: all 7 best carousels
Purpose: Complete HTML shell with preview cage, track engine, nav controls, ZIP export.
Use this as the starting point for every carousel build.
-->

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{GOOGLE_FONTS_URL}}" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-base);
  min-height: 100vh;
  font-family: var(--font-body), system-ui, sans-serif;
}
body {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px 60px;
}

/* Preview cage */
.label-top {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.30em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 18px; text-align: center;
}
.preview-cage { width: 1080px; margin: 0 auto; }
@media (max-width: 1200px) {
  .preview-cage { width: 100%; max-width: 540px; }
}
@media (min-width: 1200px) {
  .preview-cage { transform: scale(0.5); transform-origin: top center; height: 540px; }
}
.capture-mode .preview-cage { transform: none; }  /* capture-mode overrides preview scaling for ZIP export */

/* Viewer */
.viewer { width: 1080px; max-width: 1080px; overflow: hidden; }
.wrap {
  position: relative;
  width: 1080px; height: 1080px;
  aspect-ratio: 1 / 1;
}
.track {
  display: flex; width: 100%; height: 100%;
  transition: transform 0.42s cubic-bezier(0.4,0,0.2,1);
}
.slide {
  position: relative;
  min-width: 100%; height: 100%; overflow: hidden;
  padding: var(--pad-y, 96px) var(--pad-x, 80px) var(--pad-bottom-safe, 140px);
  display: flex; flex-direction: column;
  background: linear-gradient(145deg, var(--bg-base), var(--bg-mid));
  color: var(--text-primary);
}

/* Content wrapper */
.content {
  position: relative; z-index: 3;
  flex: 1; display: flex; flex-direction: column;
}

/* Controls */
.controls {
  display: flex; gap: 16px;
  align-items: center; justify-content: center;
  margin-top: 18px;
}
.btn {
  background: rgba(255,255,255,0.08); border: none;
  color: rgba(255,255,255,0.5);
  width: 40px; height: 40px; border-radius: 50%;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.btn:disabled { opacity: 0.2; cursor: default; }
.dots { display: flex; gap: 6px; }
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer; transition: all 0.2s;
}
.dot.on { background: var(--accent); width: 14px; border-radius: 3px; }
.hint {
  font-size: 10px; color: rgba(255,255,255,0.2);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-top: 10px; text-align: center;
}
.zip-btn {
  display: block; margin: 18px auto 0;
  background: var(--accent); color: var(--bg-base);
  border: none; padding: 16px 44px; border-radius: 12px;
  font-family: var(--font-display), system-ui, sans-serif;
  font-weight: 700; font-size: 15px;
  cursor: pointer; letter-spacing: 0.03em;
  transition: transform 0.2s;
}
.zip-btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>

<div class="label-top">{{CAROUSEL_LABEL}}</div>

<div class="preview-cage">
  <div class="viewer">
    <div class="wrap">
      <div class="track" id="track">

        <!-- SLIDE 1 -->
        <div class="slide" data-index="0">
          <!-- Add layers here -->
          <!-- Add decorative elements here -->
          <div class="content">
            <!-- Add slide content here -->
          </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide" data-index="1">
          <div class="content"></div>
        </div>

        <!-- Add more slides... -->

      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="prev" onclick="move(-1)">&#10094;</button>
  <div class="dots" id="dots"></div>
  <button class="btn" id="next" onclick="move(1)">&#10095;</button>
</div>
<div class="hint">Usa las flechas para navegar</div>
<button class="zip-btn" onclick="exportZip()">Exportar ZIP</button>

<script>
const track = document.getElementById('track');
const slides = document.querySelectorAll('.slide');
const dotsContainer = document.getElementById('dots');
let current = 0;
const total = slides.length;

// Build dots
slides.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.onclick = () => go(i);
  dotsContainer.appendChild(d);
});

function go(n) {
  current = Math.max(0, Math.min(n, total - 1));
  track.style.transform = 'translateX(-' + (current * 100) + '%)';
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('on', i === current);
  });
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === total - 1;
}
function move(dir) { go(current + dir); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
});

// ZIP Export
async function exportZip() {
  document.body.classList.add('capture-mode');
  const zip = new JSZip();
  const folder = zip.folder("slides");
  for (let i = 0; i < total; i++) {
    go(i);
    await new Promise(r => setTimeout(r, 600));
    const canvas = await html2canvas(document.querySelector('.slide[data-index="' + i + '"]'), {
      scale: 2, useCORS: true, backgroundColor: null
    });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    folder.file('slide_' + String(i + 1).padStart(2, '0') + '.png', blob);
  }
  const content = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = '{{FILENAME}}.zip';
  a.click();
  document.body.classList.remove('capture-mode');
}
</script>

</body>
</html>
