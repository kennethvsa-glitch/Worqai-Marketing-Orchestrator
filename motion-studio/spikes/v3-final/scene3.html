<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1023">
<title>Scene 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; background: #050505; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; }
.canvas { width: 1023px; height: 1537px; background: #010509; position: relative; overflow: hidden; flex-shrink: 0; }
.grid-overlay { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px); background-size: 60px 60px; }
.particle { position: absolute; border-radius: 50%; pointer-events: none; background: #abf317; }
.sq { position: absolute; pointer-events: none; border: 1px solid; }

/* Corner brackets */
.corner { position: absolute; width: 20px; height: 20px; border-color: rgba(171,243,23,0.3); z-index: 3; }
.corner-tl { top: 40px; left: 40px; border-top: 2px solid; border-left: 2px solid; }
.corner-tr { top: 40px; right: 40px; border-top: 2px solid; border-right: 2px solid; }
.corner-bl { bottom: 40px; left: 40px; border-bottom: 2px solid; border-left: 2px solid; }
.corner-br { bottom: 40px; right: 40px; border-bottom: 2px solid; border-right: 2px solid; }

/* Target icon */
.target-icon { position: absolute; left: 80px; top: 130px; width: 60px; height: 60px; z-index: 5; }

/* Headline */
.headline-block { position: absolute; left: 80px; top: 300px; z-index: 5; max-width: 820px; }
.headline { font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 60px; font-weight: 700; line-height: 1.18; letter-spacing: -1.5px; color: #f8f9f9; }
.green-text { font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 52px; font-weight: 700; line-height: 1.2; color: #ccff20; margin-top: 24px; }

/* Checkmark line */
.check-line { position: absolute; left: 80px; bottom: 280px; display: flex; align-items: center; gap: 16px; z-index: 5; }
.check-circle { width: 30px; height: 30px; border: 2px solid #8bc34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.check-circle::after { content: ''; width: 9px; height: 5px; border-left: 2px solid #8bc34a; border-bottom: 2px solid #8bc34a; transform: rotate(-45deg); margin-top: -2px; }
.check-text { font-size: 24px; font-weight: 500; color: #b0b0b0; }

/* Green underline */
.underline { position: absolute; left: 126px; bottom: 265px; width: 420px; height: 2px; background: linear-gradient(90deg, #8bc34a, transparent); z-index: 5; }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid-overlay"></div>
  
  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Target/user icon -->
  <div class="target-icon">
    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="26" stroke="#abf317" stroke-width="1.5" opacity="0.5"/>
      <circle cx="30" cy="30" r="18" stroke="#abf317" stroke-width="1.2" opacity="0.35"/>
      <circle cx="30" cy="30" r="10" stroke="#abf317" stroke-width="1" opacity="0.25"/>
      <circle cx="30" cy="30" r="3" fill="#abf317" opacity="0.7"/>
      <line x1="30" y1="0" x2="30" y2="10" stroke="#abf317" stroke-width="1.2" opacity="0.4"/>
      <line x1="30" y1="50" x2="30" y2="60" stroke="#abf317" stroke-width="1.2" opacity="0.4"/>
      <line x1="0" y1="30" x2="10" y2="30" stroke="#abf317" stroke-width="1.2" opacity="0.4"/>
      <line x1="50" y1="30" x2="60" y2="30" stroke="#abf317" stroke-width="1.2" opacity="0.4"/>
      <circle cx="30" cy="22" r="5" stroke="#abf317" stroke-width="1" fill="none" opacity="0.4"/>
      <path d="M 24 32 Q 30 38, 36 32" stroke="#abf317" stroke-width="1" fill="none" opacity="0.4"/>
    </svg>
  </div>

  <!-- Headline -->
  <div class="headline-block">
    <div class="headline">Los que consiguen<br>entrevistas no tienen<br>mejor experiencia que tú.</div>
    <div class="green-text">Tienen un CV distinto<br>para cada vacante.</div>
  </div>

  <!-- Checkmark line -->
  <div class="check-line">
    <div class="check-circle"></div>
    <div class="check-text">Escrito en el idioma que el filtro entiende.</div>
  </div>
  <div class="underline"></div>

  <!-- Scattered particles -->
  <div class="particle" style="width:3px;height:3px;opacity:0.3;top:100px;right:180px;box-shadow:0 0 4px rgba(171,243,23,0.4);"></div>
  <div class="particle" style="width:2px;height:2px;opacity:0.2;top:200px;right:280px;box-shadow:0 0 3px rgba(171,243,23,0.3);"></div>
  <div class="particle" style="width:3px;height:3px;opacity:0.25;top:400px;right:150px;box-shadow:0 0 4px rgba(171,243,23,0.4);"></div>
  <div class="particle" style="width:2px;height:2px;opacity:0.18;top:600px;right:350px;box-shadow:0 0 3px rgba(171,243,23,0.2);"></div>
  <div class="particle" style="width:3px;height:3px;opacity:0.3;top:800px;right:200px;box-shadow:0 0 4px rgba(171,243,23,0.4);"></div>
  <div class="particle" style="width:2px;height:2px;opacity:0.2;top:1000px;right:300px;box-shadow:0 0 3px rgba(171,243,23,0.3);"></div>
  <div class="particle" style="width:3px;height:3px;opacity:0.22;top:1200px;right:180px;box-shadow:0 0 4px rgba(171,243,23,0.3);"></div>
  <div class="particle" style="width:2px;height:2px;opacity:0.15;top:1400px;right:250px;box-shadow:0 0 3px rgba(171,243,23,0.2);"></div>

  <!-- Squares -->
  <div class="sq" style="width:8px;height:8px;border-color:rgba(171,243,23,0.15);top:150px;right:100px;"></div>
  <div class="sq" style="width:10px;height:10px;border-color:rgba(171,243,23,0.12);top:350px;right:80px;"></div>
  <div class="sq" style="width:6px;height:6px;border-color:rgba(171,243,23,0.1);top:700px;right:120px;"></div>
  <div class="sq" style="width:8px;height:8px;border-color:rgba(171,243,23,0.14);top:950px;right:250px;"></div>
</div>
</body>
</html>
