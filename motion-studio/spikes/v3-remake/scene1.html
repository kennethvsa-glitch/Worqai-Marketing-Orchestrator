<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; min-height: 100vh; background: #050505;
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; overflow-x: hidden;
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
}
.canvas {
  width: 1023px; height: 1537px; background: #010509;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.grid-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 56px 56px;
}
.circle-deco {
  position: absolute; width: 740px; height: 740px;
  border: 1.5px solid rgba(100,150,100,0.1); border-radius: 50%;
  top: 18px; left: 141px; pointer-events: none;
}
.vert-line {
  position: absolute; left: 65px; top: 280px;
  width: 2px; height: 345px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(171,243,23,0.8) 0%, rgba(171,243,23,0.2) 50%, rgba(171,243,23,0) 100%);
}
.vert-line::before {
  content: ''; position: absolute; top: -5px; left: -4px;
  width: 10px; height: 10px; border-radius: 50%; background: #abf317;
  box-shadow: 0 0 10px #abf317, 0 0 22px rgba(171,243,23,0.5);
}
.particle { position: absolute; border-radius: 50%; pointer-events: none; background: #abf317; }
.sq { position: absolute; pointer-events: none; background: transparent; }

/* Close button */
.close-btn { position: absolute; top: 42px; right: 44px; width: 28px; height: 28px; cursor: pointer; z-index: 10; }
.close-btn::before, .close-btn::after { content: ''; position: absolute; top: 50%; left: 50%; width: 20px; height: 2.5px; background: #abf317; border-radius: 1px; }
.close-btn::before { transform: translate(-50%,-50%) rotate(45deg); }
.close-btn::after { transform: translate(-50%,-50%) rotate(-45deg); }

/* Headline */
.headline-block { position: absolute; left: 80px; top: 428px; z-index: 5; }
.headline-line { font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 92px; font-weight: 700; line-height: 1.18; letter-spacing: -2px; white-space: nowrap; margin: 0; }
.headline-line .num { color: #ccff20; }
.headline-line .txt { color: #f8f9f9; }
.line2 { padding-left: 54px; }

/* Bubble - speech bubble with rounded arch top */
.bubble-icon { position: absolute; z-index: 2; }
.bubble-icon svg { overflow: visible; }

/* Subtitle - TWO lines */
.subtitle-text { position: absolute; font-size: 27px; font-weight: 600; line-height: 1.45; color: #818284; z-index: 6; }
.subtitle-text .quote { color: #a4d415; }

/* Waves */
.waves-container { position: absolute; bottom: 0; left: 0; width: 1023px; height: 680px; pointer-events: none; overflow: hidden; }
.ambient-glow { position: absolute; bottom: -200px; left: -200px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(171,243,23,0.06) 0%, transparent 70%); pointer-events: none; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.9; }
}

.drift { animation: float 6s ease-in-out infinite; }
.pulse { animation: pulse 8s ease-in-out infinite; }
</style>
</head>
