<!DOCTYPE html>
<html data-duration="7">
<head>
  <meta charset="UTF-8"><script src="../../vendor/gsap/gsap-3.15.0.min.js"></script>
  <script src="../motion-lib.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-base: #080a10; --bg-mid: #0f1420; --accent: #d4af37;
      --text-primary: #ffffff; --text-secondary: rgba(255,255,255,0.72);
      --font-display: 'Archivo Black', sans-serif; --font-body: 'Inter', sans-serif;
      --safe-top: 120px; --safe-bottom: 200px; --safe-x: 56px;
    }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }

    .geo-blob-bg {
      position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgba(212,175,55,0.16) 0%, transparent 70%);
      filter: blur(90px);
    }
    .geo-star-container { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .geo-star { position: absolute; border-radius: 50%; background: #fff; }

    .scene-content {
      position: absolute; z-index: 1;
      top: var(--safe-top); left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-bottom);
      display: flex; flex-direction: column; justify-content: center;
    }

    .quote-mark {
      font-family: var(--font-display); font-size: 160px; line-height: 0.7;
      color: var(--accent); opacity: 0.6; margin-bottom: 32px; display: block;
    }
    .quote-text {
      font-family: var(--font-body); font-size: 44px; font-weight: 300;
      font-style: italic; line-height: 1.35; color: var(--text-primary);
      max-width: 900px; margin-bottom: 0;
    }
    .rule { width: 60px; height: 1px; background: rgba(212,175,55,0.45); margin: 56px 0 36px; }
    .attribution { font-size: 18px; font-weight: 400; color: var(--text-primary); margin-bottom: 8px; }
    .attribution-role { font-size: 14px; font-weight: 300; color: var(--text-secondary); margin-bottom: 32px; }
    .handle { font-size: 13px; font-weight: 400; letter-spacing: 0.06em; color: var(--text-secondary); opacity: 0.45; }
  </style>
</head>
<body>

  <div class="geo-blob-bg" id="blob-1" style="width:800px;height:800px;top:200px;right:-200px;"></div>
  <div class="geo-blob-bg" id="blob-2" style="width:400px;height:400px;bottom:160px;left:-80px;"></div>
  <div class="geo-star-container" id="starfield"></div>

  <div class="scene-content">
    <span class="quote-mark" id="quote-mark">"</span>
    <div class="quote-text" id="quote-text" data-copy="quote">{{ copy.quote }}</div>
    <div class="rule" id="rule"></div>
    <div class="attribution"      data-copy="attribution">{{ copy.attribution }}</div>
    <div class="attribution-role" data-copy="attribution_role">{{ copy.attribution_role }}</div>
    <div class="handle"           data-copy="handle">{{ copy.handle }}</div>
  </div>

  <script>
    window.MOTION_SEED = "default";

    initGeoBlobDrift('.geo-blob-bg', window.MOTION_SEED);
    initGeoStarfield('#starfield', window.MOTION_SEED);
    splitWords("#quote-text");

    const tl = gsap.timeline();
    tl.add(scale("#quote-mark", "in", { duration: T.duration_unit * 1.2 }), 0.2);
    tl.add(textReveal("#quote-text", "in", { stagger: 0.1, duration: T.duration_unit * 1.4 }), 0.7);
    tl.add(reveal("#rule", "in", { axis: "x", duration: T.duration_unit * 1.2 }), 2.4);
    tl.add(slide(".attribution", "in"), 2.9);
    tl.add(fade(".attribution-role", "in"), 3.3);
    tl.add(gsap.timeline().fromTo(".handle", { opacity: 0 }, { opacity: 0.45, duration: T.duration_unit, ease: T.ease_default }), 3.8);

    gsap.globalTimeline.pause();
    document.fonts.ready.then(() => {
      window.motionReady = true;
      window.MOTION_LABELS = Object.fromEntries(Object.entries(tl.labels).map(([k, v]) => [k, Math.round(v * 1000)]));
    });
  </script>
</body>
</html>
