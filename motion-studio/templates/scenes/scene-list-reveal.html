<!DOCTYPE html>
<html data-duration="7">
<head>
  <meta charset="UTF-8"><script src="../../vendor/gsap/gsap-3.15.0.min.js"></script>
  <script src="../motion-lib.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-base: #080a10; --bg-mid: #0f1420; --accent: #d4af37;
      --text-primary: #ffffff; --text-secondary: rgba(255,255,255,0.72);
      --font-display: 'Archivo Black', sans-serif; --font-body: 'Inter', sans-serif;
      --safe-top: 120px; --safe-bottom: 200px; --safe-x: 56px;
    }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }

    .geo-blob-bg {
      position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgba(212,175,55,0.17) 0%, transparent 70%);
      filter: blur(80px);
    }
    .geo-star-container { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .geo-star { position: absolute; border-radius: 50%; background: #fff; }

    .scene-content {
      position: absolute; z-index: 1;
      top: var(--safe-top); left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-bottom);
      display: flex; flex-direction: column; justify-content: center;
    }

    .eyebrow {
      font-size: 13px; font-weight: 400; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 28px;
    }
    .headline {
      font-family: var(--font-display); font-size: 72px; line-height: 1.05;
      color: var(--text-primary); margin-bottom: 64px;
    }

    .list-item { display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px; }
    .list-item:last-of-type { margin-bottom: 0; }

    .item-bullet {
      flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center; margin-top: 4px;
    }
    .item-number { font-family: var(--font-display); font-size: 14px; color: var(--accent); line-height: 1; }

    .item-text { font-size: 26px; font-weight: 400; line-height: 1.45; color: var(--text-secondary); flex: 1; }
    .item-text strong { color: var(--text-primary); font-weight: 400; }

    .source-line { width: 48px; height: 1px; background: rgba(212,175,55,0.35); margin-top: 64px; margin-bottom: 20px; }
    .source { font-size: 12px; font-weight: 300; letter-spacing: 0.04em; color: var(--text-secondary); opacity: 0.45; }
  </style>
</head>
<body>

  <div class="geo-blob-bg" id="blob-1" style="width:660px;height:660px;top:-140px;right:-180px;"></div>
  <div class="geo-blob-bg" id="blob-2" style="width:440px;height:440px;bottom:280px;left:-80px;"></div>
  <div class="geo-star-container" id="starfield"></div>

  <div class="scene-content">
    <div class="eyebrow"   data-copy="eyebrow">{{ copy.eyebrow }}</div>
    <div class="headline"  data-copy="headline">{{ copy.headline }}</div>

    <div class="list-item" id="item-1">
      <div class="item-bullet"><span class="item-number">1</span></div>
      <div class="item-text" data-copy="item_1">{{ copy.item_1 }}</div>
    </div>
    <div class="list-item" id="item-2">
      <div class="item-bullet"><span class="item-number">2</span></div>
      <div class="item-text" data-copy="item_2">{{ copy.item_2 }}</div>
    </div>
    <div class="list-item" id="item-3">
      <div class="item-bullet"><span class="item-number">3</span></div>
      <div class="item-text" data-copy="item_3">{{ copy.item_3 }}</div>
    </div>

    <div class="source-line" id="source-line"></div>
    <div class="source" data-copy="source">{{ copy.source }}</div>
  </div>

  <script>
    window.MOTION_SEED = "default";

    initGeoBlobDrift('.geo-blob-bg', window.MOTION_SEED);
    initGeoStarfield('#starfield', window.MOTION_SEED);
    splitWords(".headline");

    const tl = gsap.timeline();
    tl.add(fade(".eyebrow", "in"), 0.2);
    tl.add(textReveal(".headline", "in", { stagger: T.stagger_lines }), 0.6);
    tl.add(scale("#item-1 .item-bullet", "in"), 1.4);
    tl.add(slide("#item-1 .item-text",   "in"), 1.5);
    tl.add(scale("#item-2 .item-bullet", "in"), 2.1);
    tl.add(slide("#item-2 .item-text",   "in"), 2.2);
    tl.add(scale("#item-3 .item-bullet", "in"), 2.8);
    tl.add(slide("#item-3 .item-text",   "in"), 2.9);
    tl.add(reveal("#source-line", "in", { axis: "x", duration: T.duration_unit * 1.0 }), 3.8);
    tl.add(gsap.timeline().fromTo(".source", { opacity: 0 }, { opacity: 0.45, duration: T.duration_unit, ease: T.ease_default }), 4.2);

    gsap.globalTimeline.pause();
    document.fonts.ready.then(() => {
      window.motionReady = true;
      window.MOTION_LABELS = Object.fromEntries(Object.entries(tl.labels).map(([k, v]) => [k, Math.round(v * 1000)]));
    });
  </script>
</body>
</html>
